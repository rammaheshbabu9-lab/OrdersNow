<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LOOPIN</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}

body{
  font-family:Inter,Arial,Helvetica,sans-serif;
  background:#fff;
  color:#111;
  overflow:hidden;
}

button,input,textarea{font:inherit}
button{cursor:pointer}

.app-shell{
  width:100%;
  height:100vh;
  display:flex;
  background:#fff;
}

/* ================= LEFT SIDEBAR ================= */

.sidebar{
  width:92px;
  min-width:92px;
  height:100vh;
  border-right:1px solid #e9e9e9;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:14px 8px;
  position:relative;
  z-index:20;
}

.brand{
  width:50px;
  height:50px;
  margin-bottom:15px;
}

.brand svg{
  width:50px;
  height:50px;
  display:block;
}

.side-top,
.side-bottom{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
}

.side-bottom{
  margin-top:auto;
}

.icon-btn{
  width:48px;
  height:42px;
  border:0;
  background:#fff;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
  color:#555;
  transition:.18s;
}

.icon-btn:hover{
  background:#f3f3f3;
  color:#111;
}

/* ================= APPS ================= */

.apps{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
}

.app-item{
  width:68px;
  min-height:65px;
  border:0;
  background:#fff;
  border-radius:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  transition:.18s;
  user-select:none;
}

.app-item:hover{
  background:#f5f5f5;
}

.app-logo{
  width:32px;
  height:32px;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#111;
  color:#fff;
  font-weight:800;
  font-size:11px;
  flex:none;
}

.app-logo svg{
  width:100%;
  height:100%;
  display:block;
}

.app-name{
  max-width:68px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:9px;
  color:#555;
}

/* ================= WORKSPACE ================= */

.workspace{
  flex:1;
  height:100vh;
  background:#fff;
  position:relative;
  overflow:hidden;
}

/* LARGE TOP SEARCH */

.top-search{
  position:absolute;
  top:24px;
  left:50%;
  transform:translateX(-50%);
  width:min(680px,calc(100% - 50px));
  z-index:10;
}

.top-search-inner{
  height:52px;
  width:100%;
  border:1px solid #dedede;
  border-radius:17px;
  background:#fff;
  display:flex;
  align-items:center;
  padding:0 7px 0 17px;
  box-shadow:0 5px 20px rgba(0,0,0,.055);
  transition:.2s;
}

.top-search-inner:focus-within{
  border-color:#bdbdbd;
  box-shadow:0 8px 28px rgba(0,0,0,.08);
}

.search-icon{
  font-size:23px;
  color:#777;
  margin-right:10px;
  line-height:1;
}

.top-search-inner input{
  flex:1;
  height:100%;
  border:0;
  outline:0;
  background:transparent;
  font-size:14px;
  color:#111;
}

.top-search-inner input::placeholder{
  color:#999;
}

.top-search-inner button{
  width:39px;
  height:39px;
  border:0;
  border-radius:12px;
  background:#111;
  color:#fff;
  font-size:19px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.top-search-inner button:hover{
  background:#292929;
}

.workspace-empty{
  width:100%;
  height:100%;
}

/* ================= MODALS ================= */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.28);
  backdrop-filter:blur(5px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:18px;
}

.modal{
  width:min(720px,100%);
  max-height:86vh;
  background:#fff;
  border:1px solid #e8e8e8;
  border-radius:22px;
  box-shadow:0 25px 80px rgba(0,0,0,.18);
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.modal-head{
  height:64px;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #eee;
  flex:none;
}

.modal-title{
  font-size:16px;
  font-weight:800;
}

.close{
  width:36px;
  height:36px;
  border:0;
  border-radius:10px;
  background:#f5f5f5;
  font-size:21px;
}

.close:hover{
  background:#eaeaea;
}

.modal-body{
  padding:16px;
  overflow:auto;
}

/* ================= ADD APP ================= */

.library-search{
  width:100%;
  height:44px;
  border:1px solid #ddd;
  border-radius:12px;
  padding:0 14px;
  outline:none;
  margin-bottom:12px;
  background:#fafafa;
}

.library-search:focus{
  border-color:#111;
  background:#fff;
}

.library-info{
  font-size:11px;
  color:#777;
  margin-bottom:12px;
}

.library-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.library-app{
  border:1px solid #eee;
  background:#fff;
  border-radius:13px;
  padding:10px 7px;
  min-height:82px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
}

.library-app:hover{
  border-color:#bbb;
  background:#fafafa;
}

.library-app span{
  font-size:10px;
  text-align:center;
  width:100%;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.custom-box{
  margin-top:15px;
  border-top:1px solid #eee;
  padding-top:15px;
}

.form-row{
  display:flex;
  gap:8px;
  margin-bottom:8px;
}

.form-row input{
  flex:1;
  height:42px;
  border:1px solid #ddd;
  border-radius:11px;
  padding:0 12px;
  outline:none;
}

.primary{
  border:0;
  background:#111;
  color:#fff;
  border-radius:11px;
  padding:0 16px;
  height:42px;
  font-weight:700;
}

.secondary{
  border:1px solid #ddd;
  background:#fff;
  color:#111;
  border-radius:11px;
  padding:0 16px;
  height:42px;
}

/* ================= NOTES ================= */

.note-area{
  width:100%;
  min-height:300px;
  resize:vertical;
  border:1px solid #ddd;
  border-radius:14px;
  padding:15px;
  outline:none;
  font-size:14px;
  line-height:1.6;
}

.note-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:10px;
}

/* ================= URLS ================= */

.url-input{
  width:100%;
  height:43px;
  border:1px solid #ddd;
  border-radius:11px;
  padding:0 12px;
  outline:none;
  margin-bottom:10px;
}

.url-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.url-row{
  border:1px solid #eee;
  border-radius:12px;
  padding:10px;
  display:flex;
  align-items:center;
  gap:8px;
}

.url-text{
  flex:1;
  min-width:0;
  font-size:11px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.small-btn{
  height:32px;
  border:1px solid #ddd;
  background:#fff;
  border-radius:8px;
  padding:0 9px;
  font-size:11px;
}

.small-btn:hover{
  background:#f4f4f4;
}

/* ================= SETTINGS ================= */

.setting-section{
  margin-bottom:18px;
}

.setting-title{
  font-size:12px;
  color:#777;
  margin-bottom:9px;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.setting-card{
  border:1px solid #eee;
  border-radius:14px;
  padding:13px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.setting-card strong{
  font-size:13px;
}

.setting-card small{
  display:block;
  color:#888;
  margin-top:3px;
}

/* ================= MANAGE ================= */

.manage-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.manage-row{
  display:flex;
  align-items:center;
  gap:10px;
  border:1px solid #eee;
  border-radius:13px;
  padding:9px;
}

.manage-name{
  flex:1;
  font-size:12px;
}

.remove-btn{
  border:0;
  background:#fff0f0;
  color:#d33;
  border-radius:9px;
  height:32px;
  padding:0 10px;
  font-size:11px;
}

/* ================= CONTEXT MENU ================= */

.context-menu{
  position:fixed;
  width:170px;
  background:#fff;
  border:1px solid #ddd;
  box-shadow:0 15px 45px rgba(0,0,0,.15);
  border-radius:13px;
  padding:6px;
  display:none;
  z-index:200;
}

.context-menu button{
  width:100%;
  height:38px;
  border:0;
  background:#fff;
  border-radius:8px;
  text-align:left;
  padding:0 11px;
  font-size:12px;
}

.context-menu button:hover{
  background:#f4f4f4;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%) translateY(20px);
  background:#111;
  color:#fff;
  padding:10px 15px;
  border-radius:10px;
  font-size:11px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:300;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  .sidebar{
    width:78px;
    min-width:78px;
    padding:10px 5px;
  }

  .brand,
  .brand svg{
    width:43px;
    height:43px;
  }

  .app-item{
    width:62px;
  }

  .app-name{
    max-width:62px;
  }

  .library-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .modal{
    border-radius:17px;
  }

  .top-search{
    top:15px;
    width:calc(100% - 30px);
  }

  .top-search-inner{
    height:48px;
    border-radius:15px;
    padding-left:14px;
  }

  .top-search-inner input{
    font-size:13px;
  }
}

@media(max-height:700px){

  .app-item{
    min-height:57px;
  }

  .apps{
    gap:3px;
  }
}
</style>
</head>

<body>

<div class="app-shell">

  <!-- ================= SIDEBAR ================= -->

  <aside class="sidebar">

    <div class="brand" title="LOOPIN">
      <svg viewBox="0 0 52 52">
        <defs>
          <linearGradient id="loopinGradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#111"/>
            <stop offset="1" stop-color="#3b3b3b"/>
          </linearGradient>
        </defs>

        <rect x="2" y="2" width="48" height="48" rx="15"
              fill="url(#loopinGradient)"/>

        <path d="M17 14V30.5C17 36.2 20.2 40 25.3 40C30.6 40 35 36.2 35 30.3V19C35 16.1 33.1 14 30.7 14C28.2 14 26.4 16.1 26.4 19V29.8C26.4 31.5 25.9 32.2 24.9 32.2C23.8 32.2 23.3 31.5 23.3 29.8V14"
              fill="none"
              stroke="#fff"
              stroke-width="3.7"
              stroke-linecap="round"
              stroke-linejoin="round"/>

        <circle cx="36" cy="36" r="2.3" fill="#fff"/>
      </svg>
    </div>

    <div class="side-top">

      <div id="apps" class="apps"></div>

      <button class="icon-btn"
              title="Add App"
              onclick="openAddApp()">＋</button>

    </div>

    <div class="side-bottom">

      <button class="icon-btn"
              title="Notes"
              onclick="openNotes()">▤</button>

      <button class="icon-btn"
              title="Saved URLs"
              onclick="openURLs()">🔗</button>

      <button class="icon-btn"
              title="Settings"
              onclick="openSettings()">⚙</button>

    </div>

  </aside>


  <!-- ================= WORKSPACE ================= -->

  <main class="workspace">

    <div class="top-search">

      <div class="top-search-inner">

        <span class="search-icon">⌕</span>

        <input
          id="globalSearch"
          type="text"
          placeholder="Search movies, news, apps, anything..."
          autocomplete="off">

        <button
          onclick="doGoogleSearch()"
          title="Search">→</button>

      </div>

    </div>

    <div class="workspace-empty"></div>

  </main>

</div>


<!-- ================= ADD APP ================= -->

<div id="addOverlay"
     class="overlay"
     onclick="overlayClose(event,'addOverlay')">

  <div class="modal">

    <div class="modal-head">

      <div class="modal-title">Add App</div>

      <button class="close"
              onclick="closeModal('addOverlay')">×</button>

    </div>

    <div class="modal-body">

      <input
        id="librarySearch"
        class="library-search"
        placeholder="Search 1,000+ apps..."
        autocomplete="off">

      <div id="libraryInfo"
           class="library-info"></div>

      <div id="libraryGrid"
           class="library-grid"></div>

      <div class="custom-box">

        <div class="setting-title">Custom App</div>

        <div class="form-row">

          <input
            id="customName"
            placeholder="App name">

          <input
            id="customURL"
            placeholder="https://example.com">

          <button
            class="primary"
            onclick="addCustomApp()">Add</button>

        </div>

      </div>

    </div>

  </div>

</div>


<!-- ================= NOTES ================= -->

<div id="notesOverlay"
     class="overlay"
     onclick="overlayClose(event,'notesOverlay')">

  <div class="modal">

    <div class="modal-head">

      <div class="modal-title">Notepad</div>

      <button class="close"
              onclick="closeModal('notesOverlay')">×</button>

    </div>

    <div class="modal-body">

      <textarea
        id="noteArea"
        class="note-area"
        placeholder="Write your notes..."></textarea>

      <div class="note-actions">

        <button
          class="secondary"
          onclick="clearNote()">Clear</button>

        <button
          class="primary"
          onclick="saveNote()">Save</button>

      </div>

    </div>

  </div>

</div>


<!-- ================= URLS ================= -->

<div id="urlsOverlay"
     class="overlay"
     onclick="overlayClose(event,'urlsOverlay')">

  <div class="modal">

    <div class="modal-head">

      <div class="modal-title">Saved URLs</div>

      <button class="close"
              onclick="closeModal('urlsOverlay')">×</button>

    </div>

    <div class="modal-body">

      <div class="form-row">

        <input
          id="urlInput"
          class="url-input"
          placeholder="https://example.com">

        <button
          class="primary"
          onclick="saveURL()">Save</button>

      </div>

      <div id="urlList"
           class="url-list"></div>

      <div style="margin-top:12px;text-align:right">

        <button
          class="secondary"
          onclick="clearURLs()">Clear All</button>

      </div>

    </div>

  </div>

</div>


<!-- ================= SETTINGS ================= -->

<div id="settingsOverlay"
     class="overlay"
     onclick="overlayClose(event,'settingsOverlay')">

  <div class="modal">

    <div class="modal-head">

      <div class="modal-title">Settings</div>

      <button class="close"
              onclick="closeModal('settingsOverlay')">×</button>

    </div>

    <div class="modal-body">

      <div class="setting-section">

        <div class="setting-title">Apps</div>

        <div class="setting-card">

          <div>
            <strong>Manage Apps</strong>
            <small>Add, remove and manage visible apps</small>
          </div>

          <button
            class="primary"
            onclick="openManageApps()">Manage</button>

        </div>

      </div>

      <div class="setting-section">

        <div class="setting-title">Storage</div>

        <div class="setting-card">

          <div>
            <strong>Reset LOOPIN</strong>
            <small>Remove saved apps, notes and URLs</small>
          </div>

          <button
            class="secondary"
            onclick="resetLoopin()">Reset</button>

        </div>

      </div>

    </div>

  </div>

</div>


<!-- ================= MANAGE APPS ================= -->

<div id="manageOverlay"
     class="overlay"
     onclick="overlayClose(event,'manageOverlay')">

  <div class="modal">

    <div class="modal-head">

      <div class="modal-title">Manage Apps</div>

      <button
        class="close"
        onclick="closeModal('manageOverlay')">×</button>

    </div>

    <div class="modal-body">

      <div class="library-info">
        Visible apps:
        <b id="visibleCount">0</b> / 5
      </div>

      <div
        id="manageList"
        class="manage-list"></div>

    </div>

  </div>

</div>


<!-- ================= CONTEXT MENU ================= -->

<div id="contextMenu"
     class="context-menu">

  <button onclick="contextOpen()">
    Open App
  </button>

  <button onclick="contextRemove()">
    Remove App
  </button>

</div>


<div id="toast"
     class="toast"></div>

/* =========================================================

========================================================= */

const DEFAULT_IDS=[
  "whatsapp",
  "instagram",
  "gmail",
  "youtube",
  "chatgpt"
];

let apps=[];
let contextIndex=-1;


/* =========================================================
   HELPERS
========================================================= */

function makeApp(row){

  return {
    id:row[0],
    name:row[1],
    url:row[2],
    icon:row[3]||"google"
  };
}

function findLibraryApp(id){

  return APP_LIBRARY.find(x=>x[0]===id);
}

function appLogoHTML(app){

  if(LOGOS[app.icon]){
    return LOGOS[app.icon];
  }

  const letter=
    (app.name||"A")
    .replace(/[^a-zA-Z0-9]/g,"")
    .slice(0,2)
    .toUpperCase();

  return `
    <svg viewBox="0 0 40 40">
      <rect width="40" height="40"
            rx="10" fill="#111"/>
      <text x="20" y="25"
            text-anchor="middle"
            font-family="Arial"
            font-size="12"
            font-weight="700"
            fill="#fff">${escapeHTML(letter)}</text>
    </svg>
  `;
}


/* =========================================================
   STORAGE
========================================================= */

function loadApps(){

  try{

    const saved=JSON.parse(
      localStorage.getItem(KEY_APPS)||"null"
    );

    if(Array.isArray(saved)&&saved.length){

      apps=saved;

    }else{

      apps=DEFAULT_IDS
        .map(findLibraryApp)
        .filter(Boolean)
        .map(makeApp);
    }

  }catch(e){

    apps=DEFAULT_IDS
      .map(findLibraryApp)
      .filter(Boolean)
      .map(makeApp);
  }

  fillNextApps();
  saveApps();
}

function saveApps(){

  localStorage.setItem(
    KEY_APPS,
    JSON.stringify(apps)
  );
}


/* =========================================================
   KEEP 5
========================================================= */

function fillNextApps(){

  const used=new Set(
    apps.map(a=>a.id)
  );

  for(const row of APP_LIBRARY){

    if(apps.length>=MAX_VISIBLE_APPS)
      break;

    if(!used.has(row[0])){

      apps.push(makeApp(row));
      used.add(row[0]);
    }
  }
}


/* =========================================================
   RENDER APPS
========================================================= */

function renderApps(){

  const root=document.getElementById("apps");

  root.innerHTML="";

  apps
  .slice(0,MAX_VISIBLE_APPS)
  .forEach((app,index)=>{

    const button=document.createElement("button");

    button.className="app-item";
    button.title=app.name;

    button.innerHTML=`
      <div class="app-logo">
        ${appLogoHTML(app)}
      </div>

      <div class="app-name">
        ${escapeHTML(app.name)}
      </div>
    `;

    button.onclick=()=>{
      openApp(index);
    };

    button.oncontextmenu=e=>{

      e.preventDefault();

      showContextMenu(
        e.clientX,
        e.clientY,
        index
      );
    };

    let pressTimer;

    button.addEventListener(
      "touchstart",
      e=>{

        pressTimer=setTimeout(()=>{

          const t=e.touches[0];

          showContextMenu(
            t.clientX,
            t.clientY,
            index
          );

        },650);

      },
      {passive:true}
    );

    button.addEventListener(
      "touchend",
      ()=>{
        clearTimeout(pressTimer);
      }
    );

    root.appendChild(button);
  });

  saveApps();
}


/* =========================================================
   OPEN APP
========================================================= */

function openApp(index){

  const app=apps[index];

  if(!app)return;

  window.open(
    app.url,
    "_blank"
  );
}

    );

  const results=q
    ?APP_LIBRARY.filter(x=>
        x[1].toLowerCase().includes(q)
      )
    :APP_LIBRARY;

  info.textContent=
    results.length+" apps available";

  grid.innerHTML="";

  results
    .slice(0,300)
    .forEach(row=>{

      const app=makeApp(row);

      const item=
        document.createElement("button");

      item.className="library-app";

      item.innerHTML=`
        <div class="app-logo">
          ${appLogoHTML(app)}
        </div>

        <span>
          ${escapeHTML(app.name)}
        </span>
      `;

      item.onclick=()=>{
        addLibraryApp(row[0]);
      };

      grid.appendChild(item);
    });
}

function addLibraryApp(id){

  const row=findLibraryApp(id);

  if(!row)return;

  const newApp=makeApp(row);

  apps=apps.filter(
    a=>a.id!==id
  );

  if(apps.length>=MAX_VISIBLE_APPS){
    apps.pop();
  }

  apps.push(newApp);

  fillNextApps();

  saveApps();
  renderApps();

  closeModal("addOverlay");

  toast(row[1]+" added");
}


/* =========================================================
   CUSTOM APP
========================================================= */

function addCustomApp(){

  const name=
    document.getElementById(
      "customName"
    ).value.trim();

  let url=
    document.getElementById(
      "customURL"
    ).value.trim();

  if(!name||!url){

    toast("Enter app name and URL");
    return;
  }

  if(!/^https?:\/\//i.test(url)){
    url="https://"+url;
  }

  const custom={
    id:"custom-"+Date.now(),
    name:name,
    url:url,
    icon:"custom"
  };

  if(apps.length>=MAX_VISIBLE_APPS){
    apps.pop();
  }

  apps.push(custom);

  fillNextApps();

  saveApps();
  renderApps();

  document.getElementById(
    "customName"
  ).value="";

  document.getElementById(
    "customURL"
  ).value="";

  closeModal("addOverlay");

  toast(name+" added");
}


/* =========================================================
   REMOVE APP
========================================================= */

function removeApp(index){

  if(
    index<0 ||
    index>=apps.length
  )return;

  const name=apps[index].name;

  apps.splice(index,1);

  fillNextApps();

  saveApps();
  renderApps();

  toast(name+" removed");
}


/* =========================================================
   CONTEXT MENU
========================================================= */

function showContextMenu(x,y,index){

  contextIndex=index;

  const menu=
    document.getElementById(
      "contextMenu"
    );

  menu.style.display="block";

  const width=170;
  const height=90;

  menu.style.left=
    Math.min(
      x,
      window.innerWidth-width-8
    )+"px";

  menu.style.top=
    Math.min(
      y,
      window.innerHeight-height-8
    )+"px";
}

function hideContextMenu(){

  document.getElementById(
    "contextMenu"
  ).style.display="none";

  contextIndex=-1;
}

function contextOpen(){

  if(contextIndex>=0){
    openApp(contextIndex);
  }

  hideContextMenu();
}

function contextRemove(){

  if(contextIndex>=0){
    removeApp(contextIndex);
  }

  hideContextMenu();
}

document.addEventListener(
  "click",
  e=>{

    const menu=
      document.getElementById(
        "contextMenu"
      );

    if(!menu.contains(e.target)){
      hideContextMenu();
    }
  }
);


/* =========================================================
   LARGE GOOGLE SEARCH
========================================================= */

function doGoogleSearch(){

  const input=
    document.getElementById(
      "globalSearch"
    );

  const query=
    input.value.trim();

  if(!query){

    input.focus();
    return;
  }

  const url=
    "https://www.google.com/search?q="+
    encodeURIComponent(query);

  window.open(
    url,
    "_blank"
  );

  input.value="";
}

document
.getElementById("globalSearch")
.addEventListener(
  "keydown",
  function(e){

    if(e.key==="Enter"){

      e.preventDefault();

      doGoogleSearch();
    }

  }
);


/* =========================================================
   NOTES
========================================================= */

function openNotes(){

  closeAllModals();

  const overlay=
    document.getElementById(
      "notesOverlay"
    );

  overlay.style.display="flex";

  document.getElementById(
    "noteArea"
  ).value=
    localStorage.getItem(
      KEY_NOTE
    )||"";

  setTimeout(()=>{
    document.getElementById(
      "noteArea"
    ).focus();
  },100);
}

function saveNote(){

  const value=
    document.getElementById(
      "noteArea"
    ).value;

  localStorage.setItem(
    KEY_NOTE,
    value
  );

  toast("Note saved");
}

function clearNote(){

  if(!confirm("Clear this note?"))
    return;

  document.getElementById(
    "noteArea"
  ).value="";

  localStorage.removeItem(
    KEY_NOTE
  );

  toast("Note cleared");
}

document
.getElementById("noteArea")
.addEventListener(
  "input",
  function(){

    localStorage.setItem(
      KEY_NOTE,
      this.value
    );
  }
);


/* =========================================================
   URLS
========================================================= */

function openURLs(){

  closeAllModals();

  document.getElementById(
    "urlsOverlay"
  ).style.display="flex";

  renderURLs();
}

function getURLs(){

  try{

    const data=
      JSON.parse(
        localStorage.getItem(
          KEY_URLS
        )||"[]"
      );

    return Array.isArray(data)
      ?data
      :[];

  }catch(e){

    return [];
  }
}

function saveURL(){

  let url=
    document.getElementById(
      "urlInput"
    ).value.trim();

  if(!url){

    toast("Enter URL");
    return;
  }

  if(!/^https?:\/\//i.test(url)){
    url="https://"+url;
  }

  const urls=getURLs();

  urls.unshift(url);

  localStorage.setItem(
    KEY_URLS,
    JSON.stringify(urls)
  );

  document.getElementById(
    "urlInput"
  ).value="";

  renderURLs();

  toast("URL saved");
}

function renderURLs(){

  const root=
    document.getElementById(
      "urlList"
    );

  const urls=getURLs();

  root.innerHTML="";

  if(!urls.length){

    root.innerHTML=`
      <div style="
        font-size:12px;
        color:#999;
        padding:15px 0">
        No saved URLs
      </div>
    `;

    return;
  }

  urls.forEach(
    (url,index)=>{

      const row=
        document.createElement(
          "div"
        );

      row.className="url-row";

      row.innerHTML=`
        <div class="url-text">
          ${escapeHTML(url)}
        </div>

        <button
          class="small-btn"
          onclick="openSavedURL(${index})">
          Open
        </button>

        <button
          class="small-btn"
          onclick="deleteURL(${index})">
          Delete
        </button>
      `;

      root.appendChild(row);
    }
  );
}

/* Safer URL opening */

function openSavedURL(index){

  const urls=getURLs();

  if(!urls[index])return;

  window.open(
    urls[index],
    "_blank"
  );
}

function deleteURL(index){

  const urls=getURLs();

  urls.splice(index,1);

  localStorage.setItem(
    KEY_URLS,
    JSON.stringify(urls)
  );

  renderURLs();

  toast("URL deleted");
}

function clearURLs(){

  if(!confirm(
    "Delete all saved URLs?"
  ))return;

  localStorage.removeItem(
    KEY_URLS
  );

  renderURLs();

  toast("URLs cleared");
}


/* =========================================================
   SETTINGS
========================================================= */

function openSettings(){

  closeAllModals();

  document.getElementById(
    "settingsOverlay"
  ).style.display="flex";
}

function openManageApps(){

  closeAllModals();

  document.getElementById(
    "manageOverlay"
  ).style.display="flex";

  renderManageApps();
}

function renderManageApps(){

  const root=
    document.getElementById(
      "manageList"
    );

  document.getElementById(
    "visibleCount"
  ).textContent=apps.length;

  root.innerHTML="";

  apps.forEach(
    (app,index)=>{

      const row=
        document.createElement(
          "div"
        );

      row.className="manage-row";

      row.innerHTML=`
        <div class="app-logo">
          ${appLogoHTML(app)}
        </div>

        <div class="manage-name">
          ${escapeHTML(app.name)}
        </div>

        <button
          class="remove-btn"
          onclick="manageRemove(${index})">
          Remove
        </button>
      `;

      root.appendChild(row);
    }
  );
}

function manageRemove(index){

  removeApp(index);

  renderManageApps();
}


/* =========================================================
   RESET
========================================================= */

function resetLoopin(){

  if(!confirm(
    "Reset LOOPIN?\n\nApps, notes and saved URLs will be cleared."
  )){
    return;
  }

  localStorage.removeItem(KEY_APPS);
  localStorage.removeItem(KEY_NOTE);
  localStorage.removeItem(KEY_URLS);

  apps=
    DEFAULT_IDS
    .map(findLibraryApp)
    .filter(Boolean)
    .map(makeApp);

  fillNextApps();

  saveApps();
  renderApps();

  closeAllModals();

  toast("LOOPIN reset");
}


/* =========================================================
   MODALS
========================================================= */

function closeModal(id){

  const el=
    document.getElementById(id);

  if(el){
    el.style.display="none";
  }
}

function closeAllModals(){

  document
  .querySelectorAll(".overlay")
  .forEach(
    el=>el.style.display="none"
  );
}

function overlayClose(e,id){

  if(e.target.id===id){
    closeModal(id);
  }
}

document.addEventListener(
  "keydown",
  e=>{

    if(e.key==="Escape"){

      closeAllModals();
      hideContextMenu();

    }

  }
);


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function toast(message){

  const el=
    document.getElementById(
      "toast"
    );

  el.textContent=message;

  el.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{
    el.classList.remove("show");
  },1800);
}


/* =========================================================
   SAFETY
========================================================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================================================
   LIBRARY SEARCH
========================================================= */

document
.getElementById("librarySearch")
.addEventListener(
  "input",
  renderLibrary
);


/* =========================================================
   START
========================================================= */

loadApps();
renderApps();

</script>
