<!DOCTYPE html>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
 width:100%;
 height:100%;
}

body{
 font-family:Inter,Arial,Helvetica,sans-serif;
 background:#fff;
 color:#111;
 overflow:hidden;
}

button,input,textarea{font-family:inherit}

.app{
 width:100%;
 height:100vh;
 display:flex;
 background:#fff;
}

/* ================= SIDEBAR ================= */

.sidebar{
 position:fixed;
 left:0;
 top:0;
 bottom:0;
 width:92px;
 background:#fff;
 border-right:1px solid #e8e8e8;
 display:flex;
 flex-direction:column;
 align-items:center;
 padding:16px 7px 10px;
 z-index:100;
 overflow:hidden;
}

.brand{
 width:52px;
 height:52px;
 flex:none;
 cursor:pointer;
 margin-bottom:15px;
}

.brand svg{
 width:100%;
 height:100%;
 display:block;
}

.apps{
 width:100%;
 flex:1;
 overflow-y:auto;
 overflow-x:hidden;
 scrollbar-width:none;
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:7px;
 padding:3px 0 8px;
}

.apps::-webkit-scrollbar{display:none}

.app-item{
 width:68px;
 min-height:67px;
 border:0;
 background:#fff;
 border-radius:14px;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 cursor:pointer;
 position:relative;
 transition:.16s;
 flex:none;
}

.app-item:hover{
 background:#f5f5f5;
}

.app-item:active{
 transform:scale(.96);
}

.app-logo,
.library-logo,
.manage-logo{
 width:35px;
 height:35px;
 display:flex;
 align-items:center;
 justify-content:center;
 flex:none;
 margin-bottom:4px;
}

.app-logo svg,
.library-logo svg,
.manage-logo svg{
 width:100%;
 height:100%;
 display:block;
}

.app-name{
 width:65px;
 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis;
 text-align:center;
 font-size:9px;
 color:#555;
 line-height:11px;
}

.add-app{
 width:68px;
 min-height:54px;
 flex:none;
 border:1px dashed #cfcfcf;
 background:#fff;
 border-radius:14px;
 color:#333;
 cursor:pointer;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 margin:2px 0 8px;
}

.add-app:hover{
 background:#f7f7f7;
}

.add-plus{
 font-size:22px;
 line-height:20px;
}

.add-text{
 font-size:9px;
 margin-top:3px;
}

.sidebar-bottom{
 width:100%;
 flex:none;
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:6px;
 padding-bottom:4px;
 transform:translateY(-12px);
}

.side-action{
 width:68px;
 height:39px;
 border:0;
 background:#fff;
 border-radius:12px;
 color:#555;
 font-size:10px;
 cursor:pointer;
 display:flex;
 align-items:center;
 justify-content:center;
 gap:5px;
}

.side-action:hover{
 background:#f5f5f5;
 color:#111;
}

.side-action span{
 font-size:16px;
}

/* ================= WORKSPACE ================= */

.workspace{
 margin-left:92px;
 width:calc(100% - 92px);
 height:100vh;
 position:relative;
 background:#fff;
 overflow:hidden;
}

.top-search{
 position:absolute;
 top:22px;
 left:50%;
 transform:translateX(-50%);
 width:min(700px,calc(100% - 50px));
 z-index:20;
}

.top-search-inner{
 width:100%;
 min-height:54px;
 border:1px solid #dedede;
 border-radius:17px;
 background:#fff;
 display:flex;
 align-items:center;
 padding:0 7px 0 17px;
 box-shadow:0 5px 20px rgba(0,0,0,.045);
 transition:.2s;
}

.top-search-inner:focus-within{
 border-color:#c8c8c8;
 box-shadow:0 8px 28px rgba(0,0,0,.07);
}

.search-icon{
 font-size:23px;
 color:#777;
 margin-right:10px;
 line-height:1;
}

.top-search-inner input{
 flex:1;
 width:100%;
 height:52px;
 border:0;
 outline:0;
 background:#fff;
 color:#111;
 font-size:14px;
}

.top-search-inner input::placeholder{
 color:#999;
}

.search-go{
 width:40px;
 height:40px;
 border:1px solid #dedede;
 border-radius:12px;
 background:#fff;
 color:#111;
 font-size:21px;
 cursor:pointer;
 display:flex;
 align-items:center;
 justify-content:center;
 flex:none;
}

.search-go:hover{
 background:#f5f5f5;
}

/* ================= SEARCH PANEL ================= */

.search-panel{
 position:absolute;
 top:86px;
 left:50%;
 transform:translateX(-50%);
 width:min(700px,calc(100% - 50px));
 max-height:calc(100vh - 105px);
 overflow:auto;
 background:#fff;
 border:1px solid #e8e8e8;
 border-radius:18px;
 box-shadow:0 18px 55px rgba(0,0,0,.10);
 z-index:15;
 display:none;
}

.search-panel.show{
 display:block;
}

.search-section{
 padding:10px;
}

.search-label{
 padding:8px 10px;
 font-size:10px;
 color:#999;
 text-transform:uppercase;
 letter-spacing:.7px;
}

.search-result{
 width:100%;
 min-height:58px;
 border:0;
 background:#fff;
 border-radius:13px;
 display:flex;
 align-items:center;
 gap:12px;
 padding:9px 11px;
 cursor:pointer;
 text-align:left;
}

.search-result:hover{
 background:#f6f6f6;
}

.search-result-logo{
 width:38px;
 height:38px;
 flex:none;
 display:flex;
 align-items:center;
 justify-content:center;
}

.search-result-logo svg{
 width:100%;
 height:100%;
}

.search-result-info{
 min-width:0;
 flex:1;
}

.search-result-title{
 font-size:13px;
 font-weight:650;
 color:#111;
 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis;
}

.search-result-url{
 font-size:10px;
 color:#999;
 margin-top:4px;
 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis;
}

.search-result-arrow{
 color:#999;
 font-size:17px;
}

.search-web{
 margin:5px 10px 10px;
 width:calc(100% - 20px);
 min-height:48px;
 border:1px solid #e4e4e4;
 background:#fafafa;
 border-radius:13px;
 cursor:pointer;
 display:flex;
 align-items:center;
 justify-content:center;
 gap:7px;
 font-size:12px;
 color:#333;
}

.search-web:hover{
 background:#f3f3f3;
}

.search-empty{
 padding:30px 15px;
 text-align:center;
 color:#999;
 font-size:12px;
}

/* ================= CENTER WELCOME ================= */

.welcome{
 position:absolute;
 inset:0;
 display:flex;
 align-items:center;
 justify-content:center;
 pointer-events:none;
 padding-top:80px;
}

.welcome-box{
 text-align:center;
 color:#aaa;
}

.welcome-logo{
 width:58px;
 height:58px;
 margin:0 auto 14px;
 opacity:.15;
}

.welcome-title{
 font-size:18px;
 color:#aaa;
 font-weight:600;
}

.welcome-sub{
 font-size:11px;
 margin-top:6px;
 color:#bbb;
}

/* ================= MODALS ================= */

.overlay{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.25);
 backdrop-filter:blur(5px);
 -webkit-backdrop-filter:blur(5px);
 display:none;
 align-items:center;
 justify-content:center;
 padding:18px;
 z-index:500;
}

.modal{
 width:min(620px,100%);
 max-height:88vh;
 overflow:hidden;
 background:#fff;
 border:1px solid #e5e5e5;
 border-radius:22px;
 box-shadow:0 25px 80px rgba(0,0,0,.18);
}

.modal-head{
 height:64px;
 padding:0 18px 0 22px;
 border-bottom:1px solid #eee;
 display:flex;
 align-items:center;
 justify-content:space-between;
}

.modal-title{
 font-size:17px;
 font-weight:700;
}

.close{
 width:35px;
 height:35px;
 border:0;
 border-radius:11px;
 background:#f5f5f5;
 color:#333;
 font-size:22px;
 cursor:pointer;
}

.close:hover{
 background:#ebebeb;
}

.modal-body{
 padding:18px;
 max-height:calc(88vh - 64px);
 overflow:auto;
}

/* ================= ADD APP ================= */

.library-search{
 width:100%;
 height:45px;
 border:1px solid #ddd;
 border-radius:13px;
 outline:0;
 padding:0 13px;
 font-size:13px;
 margin-bottom:13px;
}

.library{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
 max-height:55vh;
 overflow:auto;
}

.library-item{
 min-height:59px;
 border:1px solid #eee;
 background:#fff;
 border-radius:14px;
 display:flex;
 align-items:center;
 gap:10px;
 padding:8px 10px;
 cursor:pointer;
}

.library-item:hover{
 background:#f7f7f7;
}

.library-logo{
 width:34px;
 height:34px;
 margin:0;
}

.library-name{
 font-size:12px;
 color:#222;
}

/* ================= INPUTS ================= */

.field{
 margin-bottom:13px;
}

.field label{
 display:block;
 font-size:11px;
 color:#666;
 margin-bottom:6px;
}

.field input,
.field textarea{
 width:100%;
 border:1px solid #ddd;
 border-radius:12px;
 padding:11px 12px;
 outline:0;
 font-size:13px;
 color:#111;
 background:#fff;
}

.field textarea{
 min-height:180px;
 resize:vertical;
}

.field input:focus,
.field textarea:focus{
 border-color:#aaa;
}

.primary{
 height:43px;
 width:100%;
 border:0;
 border-radius:12px;
 background:#111;
 color:#fff;
 font-size:13px;
 font-weight:600;
 cursor:pointer;
}

.primary:hover{
 background:#2a2a2a;
}

.secondary{
 height:42px;
 border:1px solid #ddd;
 background:#fff;
 color:#222;
 border-radius:12px;
 padding:0 15px;
 cursor:pointer;
}

/* ================= SAVED ================= */

.saved-tools{
 display:flex;
 gap:8px;
 margin-bottom:12px;
}

.saved-tools input{
 flex:1;
 height:42px;
 border:1px solid #ddd;
 border-radius:12px;
 outline:0;
 padding:0 12px;
 font-size:12px;
}

.saved-list{
 display:flex;
 flex-direction:column;
 gap:8px;
}

.saved-card{
 border:1px solid #eee;
 border-radius:14px;
 padding:11px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
}

.saved-info{
 min-width:0;
 flex:1;
}

.saved-title{
 font-size:12px;
 font-weight:700;
 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis;
}

.saved-preview{
 font-size:10px;
 color:#888;
 margin-top:4px;
 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis;
}

.saved-date{
 font-size:9px;
 color:#aaa;
 margin-top:3px;
}

.saved-actions{
 display:flex;
 gap:5px;
 flex:none;
}

.small-btn{
 height:32px;
 padding:0 9px;
 border:1px solid #ddd;
 background:#fff;
 border-radius:9px;
 font-size:10px;
 cursor:pointer;
}

.small-btn:hover{
 background:#f5f5f5;
}

.danger{
 color:#c62828;
}

/* ================= SETTINGS ================= */

.setting-list{
 display:flex;
 flex-direction:column;
 gap:8px;
}

.setting-btn{
 width:100%;
 min-height:50px;
 border:1px solid #eee;
 background:#fff;
 border-radius:13px;
 text-align:left;
 padding:0 14px;
 cursor:pointer;
 font-size:12px;
}

.setting-btn:hover{
 background:#f7f7f7;
}

.manage-list{
 display:flex;
 flex-direction:column;
 gap:8px;
}

.manage-row{
 min-height:55px;
 border:1px solid #eee;
 border-radius:13px;
 display:flex;
 align-items:center;
 gap:10px;
 padding:8px;
}

.manage-logo{
 width:34px;
 height:34px;
 margin:0;
}

.manage-name{
 flex:1;
 font-size:12px;
}

/* ================= CONTEXT ================= */

.context-menu{
 position:fixed;
 display:none;
 width:165px;
 background:#fff;
 border:1px solid #e5e5e5;
 border-radius:13px;
 box-shadow:0 15px 45px rgba(0,0,0,.15);
 padding:5px;
 z-index:1000;
}

.context-menu button{
 width:100%;
 height:38px;
 border:0;
 background:#fff;
 border-radius:9px;
 text-align:left;
 padding:0 10px;
 font-size:11px;
 cursor:pointer;
}

.context-menu button:hover{
 background:#f5f5f5;
}

/* ================= TOAST ================= */

.toast{
 position:fixed;
 left:50%;
 bottom:24px;
 transform:translateX(-50%) translateY(20px);
 background:#111;
 color:#fff;
 border-radius:12px;
 padding:10px 15px;
 font-size:11px;
 opacity:0;
 pointer-events:none;
 transition:.22s;
 z-index:2000;
}

.toast.show{
 opacity:1;
 transform:translateX(-50%) translateY(0);
}

/* ================= MOBILE ================= */

@media(max-width:600px){

 .sidebar{
  width:78px;
  padding:12px 5px 8px;
 }

 .brand{
  width:47px;
  height:47px;
  margin-bottom:10px;
 }

 .app-item,
 .add-app,
 .side-action{
  width:62px;
 }

 .app-item{
  min-height:62px;
 }

 .app-logo{
  width:32px;
  height:32px;
 }

 .app-name{
  width:58px;
  font-size:8px;
 }

 .sidebar-bottom{
  transform:translateY(-8px);
  gap:4px;
 }

 .side-action{
  height:35px;
  font-size:8px;
 }

 .side-action span{
  font-size:14px;
 }

 .workspace{
  margin-left:78px;
  width:calc(100% - 78px);
 }

 .top-search{
  top:14px;
  width:calc(100% - 25px);
 }

 .top-search-inner{
  min-height:48px;
  border-radius:15px;
  padding-left:13px;
 }

 .top-search-inner input{
  height:46px;
  font-size:12px;
 }

 .search-panel{
  top:70px;
  width:calc(100% - 25px);
  max-height:calc(100vh - 85px);
  border-radius:16px;
 }

 .library{
  grid-template-columns:1fr;
 }

 .modal{
  border-radius:18px;
 }

 .saved-card{
  align-items:flex-start;
  flex-direction:column;
 }

 .saved-actions{
  width:100%;
 }

 .saved-actions button{
  flex:1;
 }
}
</style>
</head>

<div class="app">

<!-- ================= SIDEBAR ================= -->

<aside class="sidebar">

<div class="brand" title="LOOPIN">
<svg viewBox="0 0 52 52">
<defs>
<linearGradient id="loopinGradient" x1="0" y1="0" x2="1" y2="1">

</button>

</aside>

<!-- ================= WORKSPACE ================= -->

<main class="workspace">

<div class="top-search">

<div class="top-search-inner">

<input
id="globalSearch"
type="text"
placeholder="Search apps, websites, anything..."
autocomplete="off">

<button
class="search-go"
onclick="performSearch()"
title="Search">
→
</button>

</div>

</div>

<!-- SEARCH SUGGESTIONS -->

<div id="searchPanel" class="search-panel"></div>

<!-- EMPTY CENTER -->

<div class="welcome" id="welcome">

<div class="welcome-box">

<div class="welcome-logo">
<svg viewBox="0 0 52 52">
<rect x="2" y="2" width="48" height="48" rx="15" fill="#111"/>
<path
d="M17 14V30.5C17 36.2 20.2 40 25.3 40C30.6 40 35 36.2 35 30.3V19C35 16.1 33.1 14 30.7 14C28.2 14 26.4 16.1 26.4 19V29.8C26.4 31.5 25.9 32.2 24.9 32.2C23.8 32.2 23.3 31.5 23.3 29.8V14"
fill="none"

stroke-width="3.7"

<div class="welcome-title">LOOPIN</div>

</div>

</div>

</div>

</main>

</div>

<!-- ================= ADD APP ================= -->

×
</button>

</div>

id="customName"

<input

</div>
</div>
</div>

<div class="overlay" id="notesOverlay">

×
</button>

</div>

</div>

</div>
</div>
</div>

<!-- ================= SAVED URLS ================= -->

<div class="modal">

class="close"

×
</button>

</div>

</div>

×
</button>

</div>

</span>

</button>

</span>

</button>

</div>

</div>
</div>
</div>

<div class="modal">

<div class="modal-head">

<div class="modal-title">Manage Apps</div>

<button

</button>

</div>

<div id="manageList" class="manage-list"></div>

</div>
</div>

Open App
</button>

Remove App
</button>

</div>

/* =====================================================
   STORAGE
===================================================== */

/* =====================================================
   HELPERS
===================================================== */

function makeApp(row){
 return {
  id:row[0],
  name:row[1],
  url:row[2]
 };
}

function findLibraryApp(id){
 return BASE_APPS.find(x=>x[0]===id);
}

function safeURL(url){

 if(!url)return "#";

 return /^https?:\/\//i.test(url)
 ? url
 : "https://"+url;
}

function escapeHTML(value){

 return String(value??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

function escapeAttr(value){
 return escapeHTML(value);
}

function getLogoSVG(app){

 return LOGOS[app.id] || LOGOS.search;
}

function appLogoHTML(app){

 return `
 <div class="app-logo" title="${escapeAttr(app.name)}">
 ${getLogoSVG(app)}
 </div>`;
}


/* =====================================================
   APPS
===================================================== */

function loadApps(){

 try{

  const raw=localStorage.getItem(KEY_APPS);

  if(raw){

   const parsed=JSON.parse(raw);

   if(Array.isArray(parsed)){

    apps=parsed
    .filter(x=>x&&x.id&&x.name&&x.url)
    .slice(0,MAX_VISIBLE_APPS);
   }
  }

 }catch(e){

  apps=[];
 }

 /*
   Old LOOPIN data lo previous apps unte
   ippudu requested default apps ki reset.
 */

 const requiredDefaults=DEFAULT_IDS
 .map(findLibraryApp)
 .filter(Boolean)
 .map(makeApp);

 /*
   First install:
   Instagram
   LinkedIn
   ChatGPT
   Teams
   GitHub
 */

 if(!apps.length){

  apps=requiredDefaults;

 }else{

  /*
    Existing custom apps preserve chestu,
    missing default apps ni maintain chestam.
  */

  const existingIds=new Set(apps.map(a=>a.id));

  requiredDefaults.forEach(app=>{

   if(!existingIds.has(app.id) && apps.length<MAX_VISIBLE_APPS){

    apps.push(app);
   }

  });

 }

 saveApps();
}


function saveApps(){

 localStorage.setItem(
  KEY_APPS,
  JSON.stringify(apps)
 );
}


function renderApps(){

 const box=document.getElementById("apps");

 box.innerHTML="";

 apps.forEach((app,index)=>{

  const button=document.createElement("button");

  button.className="app-item";
  button.title=app.name;

  button.innerHTML=
   appLogoHTML(app)+
   `<div class="app-name">
   ${escapeHTML(app.name)}
   </div>`;

  button.onclick=()=>openApp(index);

  button.addEventListener("contextmenu",e=>{

   e.preventDefault();

   showContextMenu(
    e.clientX,
    e.clientY,
    index
   );
  });

  button.addEventListener("touchstart",()=>{

   contextTimer=setTimeout(()=>{

    showContextMenu(
     window.innerWidth/2,
     window.innerHeight/2,
     index
    );

   },650);

  },{passive:true});

  button.addEventListener(
   "touchend",
   clearContextTimer
  );

  button.addEventListener(
   "touchmove",
   clearContextTimer
  );

  box.appendChild(button);

 });
}


function openApp(index){

 if(index<0||index>=apps.length)return;

 window.open(
  safeURL(apps[index].url),
  "_blank",
  "noopener"
 );
}

function openAddApp(){

  "addOverlay"

 ).value="";

 renderLibrary();
}


function renderLibrary(){

 const query=document
 .getElementById("librarySearch")
 .value
 .trim()
 .toLowerCase();

 const box=document.getElementById("library");

 const used=new Set(
  apps.map(a=>a.id)
 );

 const rows=BASE_APPS
 .filter(row=>{

  if(used.has(row[0]))return false;

  if(!query)return true;

  return row[1]
   .toLowerCase()
   .includes(query);

 })
 .slice(0,100);

 box.innerHTML="";

 if(!rows.length){

  box.innerHTML=`
  <div style="
  grid-column:1/-1;
  text-align:center;
  padding:25px;
  color:#888;
  font-size:12px">
  No apps found
  </div>`;

  return;
 }

 rows.forEach(row=>{

  const item=document.createElement("div");

  item.className="library-item";

  const temp=makeApp(row);

  item.innerHTML=`
  <div class="library-logo">
  ${getLogoSVG(temp)}
  </div>

  <div class="library-name">
  ${escapeHTML(row[1])}
  </div>
  `;

  item.onclick=()=>addLibraryApp(row[0]);

  box.appendChild(item);
 });
}


function addLibraryApp(id){

 const row=findLibraryApp(id);

 if(!row)return;

 const newApp=makeApp(row);

 if(apps.length>=MAX_VISIBLE_APPS){

  apps.shift();
 }

 apps.push(newApp);

 saveApps();
 renderApps();

 closeModal("addOverlay");

 toast(row[1]+" added");
}

 .getElementById("customName")
 .value
 .trim();

 let url=document
 .getElementById("customURL")
 .value
 .trim();

 if(!name){

  toast("Enter app name");

  return;
 }

 if(!url){

  toast("Enter app URL");

  return;
 }

 url=safeURL(url);

 if(apps.length>=MAX_VISIBLE_APPS){

  apps.shift();
 }

 apps.push({
  id:"custom_"+Date.now(),
  name:name,
  url:url
 });

 saveApps();
 renderApps();

 document.getElementById("customName").value="";
 document.getElementById("customURL").value="";

 closeModal("addOverlay");

 toast(name+" added");
}


/* =====================================================
   REMOVE
===================================================== */

function removeApp(index){

 if(index<0||index>=apps.length)return;

 const name=apps[index].name;

 apps.splice(index,1);

 saveApps();
 renderApps();

 toast(name+" removed");
}


/* =====================================================
   CONTEXT MENU
===================================================== */

function showContextMenu(x,y,index){

 contextIndex=index;

 const menu=document.getElementById(
  "contextMenu"
 );

 menu.style.display="block";

 const maxX=
  window.innerWidth-
  menu.offsetWidth-
  8;

 const maxY=
  window.innerHeight-
  menu.offsetHeight-
  8;

 menu.style.left=
  Math.min(x,maxX)+"px";

 menu.style.top=
  Math.min(y,maxY)+"px";
}


function hideContextMenu(){

 document.getElementById(
  "contextMenu"
 ).style.display="none";

 contextIndex=-1;
}


function contextOpen(){

 if(contextIndex>=0){

  openApp(contextIndex);
 }

 hideContextMenu();
}


function contextRemove(){

 if(contextIndex>=0){

  removeApp(contextIndex);
 }

 hideContextMenu();
}


function clearContextTimer(){

 if(contextTimer){

  clearTimeout(contextTimer);

  contextTimer=null;
 }
}


/* =====================================================
   SEARCH ENGINE
===================================================== */

const searchInput=
 document.getElementById("globalSearch");

const searchPanel=
 document.getElementById("searchPanel");


searchInput.addEventListener(
 "input",
 showSearchSuggestions
);


searchInput.addEventListener(
 "focus",
 ()=>{

  if(searchInput.value.trim()){

   showSearchSuggestions();
  }

 }
);


searchInput.addEventListener(
 "keydown",
 e=>{

  if(e.key==="Enter"){

   e.preventDefault();

   performSearch();
  }

  if(e.key==="Escape"){

   closeSearch();
   searchInput.blur();
  }
 }
);


function showSearchSuggestions(){

 const query=
  searchInput.value
  .trim()
  .toLowerCase();

 if(!query){

  closeSearch();

  return;
 }

 const appMatches=
  BASE_APPS
  .filter(row=>
   row[1]
   .toLowerCase()
   .includes(query)
  )
  .slice(0,6);

 let html="";

 if(appMatches.length){

  html+=`
  <div class="search-section">

  <div class="search-label">
  Apps & websites
  </div>
  `;

  appMatches.forEach(row=>{

   const app=makeApp(row);

   html+=`
   <button
   class="search-result"
   onclick="openSearchApp('${escapeAttr(row[0])}')">

   <div class="search-result-logo">
   ${getLogoSVG(app)}
   </div>

   <div class="search-result-info">

   <div class="search-result-title">
   ${escapeHTML(row[1])}
   </div>

   <div class="search-result-url">
   ${escapeHTML(row[2])}
   </div>

   </div>

   <div class="search-result-arrow">
   ›
   </div>

   </button>
   `;
  });

  html+=`</div>`;
 }

 /*
   General web search.
   User type chesthe:
   "chatgpt"
   -> ChatGPT suggestion
   -> Search Web "chatgpt"
 */

 html+=`
 <button
 class="search-web"
 onclick="searchGoogleFromLoopin()">

 🔎 Search the web for
 <b>${escapeHTML(searchInput.value.trim())}</b>

 </button>
 `;

 searchPanel.innerHTML=html;

 searchPanel.classList.add("show");
}


function openSearchApp(id){

 const row=findLibraryApp(id);

 if(!row)return;

 closeSearch();

 window.open(
  safeURL(row[2]),
  "_blank",
  "noopener"
 );
}


function searchGoogleFromLoopin(){

 const query=
  searchInput.value.trim();

 if(!query)return;

 closeSearch();

 /*
   Only when user explicitly chooses
   Search the web, Google opens.
 */

 window.open(
  "https://www.google.com/search?q="+
  encodeURIComponent(query),
  "_blank",
  "noopener"
 );

 searchInput.value="";
}


function performSearch(){

 const query=
  searchInput.value.trim();

 if(!query){

  searchInput.focus();

  return;
 }

 /*
   Exact / strong app match first.
 */

 const exact=
  BASE_APPS.find(row=>
   row[1].toLowerCase()===query.toLowerCase()
  );

 if(exact){

  closeSearch();

  window.open(
   safeURL(exact[2]),
   "_blank",
   "noopener"
  );

  searchInput.value="";

  return;
 }

 /*
   If no direct app:
   show search options first.
 */

 showSearchSuggestions();
}


function closeSearch(){

 searchPanel.classList.remove("show");
}

  const data=

   ?data

 document.getElementById(
  "notesListView"
 ).style.display="block";

 ).style.display="none";

}


function newNote(){

 editingNoteId=null;

 document.getElementById(
  "noteName"
 ).value="";

 document.getElementById(
  "noteText"
 ).value="";

 document.getElementById(
  "notesListView"
 ).style.display="none";

 document.getElementById(
  "noteEditor"
 ).style.display="block";

 setTimeout(()=>{

  document.getElementById(
   "noteName"
  ).focus();

 },100);
}


function editNote(id){

 const note=
  getNotes().find(
   x=>x.id===id
  );

 if(!note)return;

 editingNoteId=id;

 document.getElementById(
  "noteName"
 ).value=note.name;

 document.getElementById(
  "noteText"
 ).value=note.text;

 document.getElementById(
  "notesListView"
 ).style.display="none";

 document.getElementById(
  "noteEditor"
 ).style.display="block";
}


function saveNote(){

 const name=
  document.getElementById(
   "noteName"
  ).value.trim();

 const text=
  document.getElementById(
   "noteText"
  ).value;

 if(!name){

  toast("Enter note name");

  return;
 }

 if(!text.trim()){

  toast("Write something");

  return;
 }

 const notes=getNotes();

 if(editingNoteId){

  const index=
   notes.findIndex(
    x=>x.id===editingNoteId
   );

  if(index>=0){

   notes[index].name=name;
   notes[index].text=text;
   notes[index].updated=Date.now();
  }

  toast("Note updated");

 }else{

  notes.unshift({

   id:Date.now(),

   name:name,

   text:text,

   created:Date.now(),

   updated:Date.now()
  });

  toast("Note saved");
 }

 saveNotes(notes);

 showNotesList();
}


function deleteNote(id){

 if(!confirm("Delete this note?"))return;

 saveNotes(
  getNotes().filter(
   x=>x.id!==id
  )
 );

 renderNotes();

 toast("Note deleted");
}


function renderNotes(){

 const box=
  document.getElementById(
   "notesList"
  );

 const notes=getNotes();

 box.innerHTML="";

 if(!notes.length){

  box.innerHTML=`
  <div style="
  padding:30px 10px;
  text-align:center;
  color:#999;
  font-size:12px">

  No saved notes

  <br><br>

  Tap <b>+ New Note</b> to create one

  </div>`;

  return;
 }

 notes.forEach(note=>{

  const card=
   document.createElement("div");

  card.className="saved-card";

  const date=
   new Date(
    note.updated||note.created
   );

  card.innerHTML=`

  <div class="saved-info">

   <div class="saved-title">
   ${escapeHTML(note.name)}
   </div>

   <div class="saved-preview">
   ${escapeHTML(note.text)}
   </div>

   <div class="saved-date">
   ${date.toLocaleString()}
   </div>

  </div>

  <div class="saved-actions">

   <button
   class="small-btn"
   onclick="editNote(${note.id})">
   Open / Edit
   </button>

   <button
   class="small-btn danger"
   onclick="deleteNote(${note.id})">
   Delete
   </button>

  </div>
  `;

  box.appendChild(card);
 });
}

 try{

  const data=
   JSON.parse(
    localStorage.getItem(KEY_URLS)||"[]"
   );

  return Array.isArray(data)
   ?data
   :[];

 }catch(e){

  return [];
 }
}


function saveURLs(data){

 localStorage.setItem(
  KEY_URLS,
  JSON.stringify(data)
 );
}


function openURLs(){

 renderURLs();

 document.getElementById(
  "urlsOverlay"
 ).style.display="flex";
}


function saveURL(){

 let url=
  document.getElementById(
   "urlInput"
  ).value.trim();

 if(!url){

  toast("Enter URL");

  return;
 }

 url=safeURL(url);

 const urls=getURLs();

 urls.unshift({

  id:Date.now(),

  name:url
   .replace(/^https?:\/\//,"")
   .split("/")[0],

  url:url,

  created:Date.now()
 });

 saveURLs(urls);

 document.getElementById(
  "urlInput"
 ).value="";

 renderURLs();

 toast("URL saved");
}


function renderURLs(){

 const box=
  document.getElementById(
   "urlList"
  );

 const urls=getURLs();

 box.innerHTML="";

 if(!urls.length){

  box.innerHTML=`
  <div style="
  padding:30px 10px;
  text-align:center;
  color:#999;
  font-size:12px">

  No saved URLs

  </div>`;

  return;
 }

 urls.forEach(item=>{

  const row=
   document.createElement("div");

  row.className="saved-card";

  const date=
   new Date(item.created);

  row.innerHTML=`

  <div class="saved-info">

   <div class="saved-title">
   ${escapeHTML(item.name)}
   </div>

   <div class="saved-preview">
   ${escapeHTML(item.url)}
   </div>

   <div class="saved-date">
   ${date.toLocaleString()}
   </div>

  </div>

  <div class="saved-actions">

   <button
   class="small-btn"
   onclick="openSavedURL(${item.id})">
   Open
   </button>

   <button
   class="small-btn danger"
   onclick="deleteURL(${item.id})">
   Delete
   </button>

  </div>
  `;

  box.appendChild(row);
 });
}


function openSavedURL(id){

 const item=
  getURLs().find(
   x=>x.id===id
  );

 if(!item)return;

 window.open(
  safeURL(item.url),
  "_blank",
  "noopener"
 );
}


function deleteURL(id){

 saveURLs(
  getURLs().filter(
   x=>x.id!==id
  )
 );

 renderURLs();

 toast("URL deleted");
}


function clearURLs(){

 if(!confirm(
  "Delete all saved URLs?"
 ))return;

 localStorage.removeItem(KEY_URLS);

 renderURLs();

 toast("All URLs cleared");
}

 document.getElementById(
  "settingsOverlay"
 ).style.display="flex";
}


function openManageApps(){

 closeModal("settingsOverlay");

 renderManageApps();

 document.getElementById(
  "manageOverlay"
 ).style.display="flex";

  document.getElementById(
   "manageList"
  );

 box.innerHTML="";

 apps.forEach((app,index)=>{

   document.createElement("div");

  row.className="manage-row";

  row.innerHTML=`

  ${getLogoSVG(app)}
  </div>

  </div>

  <button
  class="small-btn danger"
  onclick="removeManagedApp(${index})">
  Remove
  </button>

  `;

  box.appendChild(row);
 });
}


function removeManagedApp(index){

 removeApp(index);

 renderManageApps();
}


function resetLoopin(){

 if(!confirm(
  "Reset LOOPIN to Instagram, LinkedIn, ChatGPT, Teams and GitHub?"
 ))return;

 localStorage.removeItem(KEY_APPS);
 localStorage.removeItem(KEY_NOTES);
 localStorage.removeItem(KEY_URLS);

 apps=
  DEFAULT_IDS
  .map(findLibraryApp)
  .filter(Boolean)
  .map(makeApp);

 saveApps();

 renderApps();

 renderNotes();

 renderURLs();

 closeModal("settingsOverlay");

 closeModal("manageOverlay");

 toast("LOOPIN reset");
}


/* =====================================================
   MODALS
===================================================== */

function closeModal(id){

 const el=
  document.getElementById(id);

 if(el){

  el.style.display="none";
 }
}


document.querySelectorAll(
 ".overlay"
).forEach(overlay=>{

 overlay.addEventListener(
  "click",
  e=>{

   if(e.target===overlay){

    overlay.style.display="none";
   }

  }
 );

});


document.addEventListener(
 "keydown",
 e=>{

  if(e.key==="Escape"){

   document
   .querySelectorAll(".overlay")
   .forEach(x=>{
    x.style.display="none";
   });

   closeSearch();

   hideContextMenu();
  }
 }
);


document.addEventListener(
 "click",
 e=>{

  const menu=
   document.getElementById(
    "contextMenu"
   );

  const search=
   document.getElementById(
    "searchPanel"
   );

  const input=
   document.getElementById(
    "globalSearch"
   );

  if(
   menu.style.display==="block" &&
   !menu.contains(e.target)
  ){

   hideContextMenu();
  }

  /*
    Search panel outside click close.
  */

  if(
   search.classList.contains("show") &&
   !search.contains(e.target) &&
   !input.contains(e.target)
  ){

   closeSearch();
  }

 }
);

 renderLibrary
);

.getElementById("urlInput")

 }
);

   TOAST
===================================================== */

let toastTimer=null;


function toast(message){

 const el=
  document.getElementById(
   "toast"
  );

 el.textContent=message;

 el.classList.add("show");

 clearTimeout(toastTimer);

 toastTimer=setTimeout(()=>{

  el.classList.remove("show");

 },1800);
}

renderApps();
