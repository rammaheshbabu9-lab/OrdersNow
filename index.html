<body>
<div class="app">
<aside class="side">
  <div class="brand" onclick="goHome()" title="LOOPIN"><svg viewBox="0 0 48 48"><rect x="3" y="3" width="42" height="42" rx="14" fill="#111"/><path d="M15 16h12a6 6 0 1 1 0 12H15a6 6 0 1 0 0 12h12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="34" cy="16" r="3" fill="#fff"/></svg></div>
  <div id="appList" class="apps"></div>
  <div class="addside"><button class="sidebtn" onclick="openAddApp()" title="Add App">+</button></div>
  <button class="sidebtn" onclick="openNotes()" title="Notes">⌁</button>
  <button class="sidebtn" onclick="openSaved()" title="Saved URLs">↗</button>
  <button class="sidebtn" onclick="openSettings()" title="Settings">⚙</button>
</aside>
<main class="main">
  <div class="top"><div class="searchwrap"><input id="searchInput" class="search" placeholder="Search apps or the web…" autocomplete="off" oninput="handleSearch(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();chromeSearch()}"><button id="searchClear" class="clear" onclick="clearSearch()">×</button><div id="searchPanel" class="panel"></div></div></div>
  <section class="hero"><div><h1>LOOPIN</h1><p>Your simple workspace for apps, notes and saved links.</p><div class="quick"><button class="pill" onclick="openAddApp()">+ Add App</button><button class="pill" onclick="openNotes()">Open Notepad</button><button class="pill" onclick="openSaved()">Saved URLs</button><button class="pill" onclick="openSettings()">Settings</button></div></div></section>
  <div class="bottom"><span>LOOPIN</span><span>•</span><button onclick="openManageApps()">Manage Apps</button></div>
</main>
</div>

<div id="addOverlay" class="modal-overlay" onclick="overlayClose(event,'addOverlay')"><div class="modal"><div class="modal-head"><h2>Add App</h2><button class="close" onclick="closeModal('addOverlay')">×</button></div><div class="limit" id="appLimit"></div><div class="field"><label>SEARCH APP LIBRARY</label><input id="librarySearch" placeholder="Instagram, Slack, Canva…" oninput="renderLibrary(this.value)"></div><div id="library" class="library"></div><div style="height:15px"></div><div class="field"><label>CUSTOM WEBSITE / APP</label><input id="customName" placeholder="App name"></div><div class="field"><input id="customUrl" placeholder="https://example.com"></div><div class="actions"><button class="btn" onclick="closeModal('addOverlay')">Cancel</button><button class="btn primary" onclick="addCustomApp()">Add Custom</button></div></div></div>

<div id="notesOverlay" class="modal-overlay" onclick="overlayClose(event,'notesOverlay')"><div class="modal"><div class="modal-head"><h2>Notepad</h2><button class="close" onclick="closeModal('notesOverlay')">×</button></div><div class="actions" style="margin:0 0 14px"><button class="btn primary" onclick="newNote()">+ New Note</button></div><div id="notesList" class="note-list"></div></div></div>

<div id="noteEditorOverlay" class="modal-overlay" onclick="overlayClose(event,'noteEditorOverlay')"><div class="modal"><div class="modal-head"><h2 id="noteEditorTitle">New Note</h2><button class="close" onclick="closeModal('noteEditorOverlay')">×</button></div><div class="field"><label>TITLE</label><input id="noteTitle" placeholder="Note title"></div><div class="field"><label>NOTE</label><textarea id="noteBody" placeholder="Write something…"></textarea></div><div class="actions"><button class="btn" onclick="closeModal('noteEditorOverlay')">Cancel</button><button class="btn primary" onclick="saveCurrentNote()">Save Note</button></div></div></div>

<div id="savedOverlay" class="modal-overlay" onclick="overlayClose(event,'savedOverlay')"><div class="modal"><div class="modal-head"><h2>Saved URLs</h2><button class="close" onclick="closeModal('savedOverlay')">×</button></div><div class="field"><label>WEBSITE NAME</label><input id="saveUrlName" placeholder="My website"></div><div class="field"><label>URL</label><input id="saveUrlInput" placeholder="https://example.com"></div><div class="actions"><button class="btn primary" onclick="saveUrl()">Save URL</button></div><div id="urlsList" class="note-list" style="margin-top:15px"></div></div></div>

<div id="settingsOverlay" class="modal-overlay" onclick="overlayClose(event,'settingsOverlay')"><div class="modal"><div class="modal-head"><h2>Settings</h2><button class="close" onclick="closeModal('settingsOverlay')">×</button></div><div class="settings-grid"><div class="setting"><div><strong>Manage Apps</strong><span>Add, remove and manage your 5 workspace apps.</span></div><button class="btn" onclick="openManageApps()">Open</button></div><div class="setting"><div><strong>Reset LOOPIN</strong><span>Restore default apps and clear notes and saved URLs.</span></div><button class="btn danger" onclick="resetLoopin()">Reset</button></div></div></div></div>

<div id="manageOverlay" class="modal-overlay" onclick="overlayClose(event,'manageOverlay')"><div class="modal"><div class="modal-head"><h2>Manage Apps</h2><button class="close" onclick="closeModal('manageOverlay')">×</button></div><div class="limit" id="manageLimit"></div><div id="manageList" class="note-list"></div><div class="actions"><button class="btn primary" onclick="openAddApp()">+ Add App</button></div></div></div>
<div id="contextMenu" class="context"><button onclick="contextOpen()">Open App</button><button onclick="contextRemove()">Remove App</button></div>
<div id="toast" class="toast"></div>

function getLogoSVG(a){return LOGOS[a.id]||LOGOS.generic}
let apps=[],notes=[],savedUrls=[],editingNoteId=null,contextIndex=-1,longPressTimer=null,longPressTriggered=false;
function loadJSON(k,f){try{const x=localStorage.getItem(k);return x===null?f:JSON.parse(x)}catch{return f}}
function saveApps(){localStorage.setItem(KEY_APPS,JSON.stringify(apps))}function saveNotes(){localStorage.setItem(KEY_NOTES,JSON.stringify(notes))}function saveUrls(){localStorage.setItem(KEY_URLS,JSON.stringify(savedUrls))}
function normalizeURL(v){let s=(v||'').trim();if(!s)return null;if(!/^https?:\/\//i.test(s))s='https://'+s;try{const u=new URL(s);if(!u.hostname||!u.hostname.includes('.'))return null;return u.href}catch{return null}}
function escapeHTML(s){return String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
let toastTimer;function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200)}
function validApp(a){return a&&typeof a.name==='string'&&typeof a.url==='string'&&normalizeURL(a.url)}
function init(){const stored=loadJSON(KEY_APPS,null);if(Array.isArray(stored)){apps=stored.filter(validApp).slice(0,MAX_VISIBLE_APPS).map(a=>({...a,url:normalizeURL(a.url)}))}else{apps=DEFAULT_APPS.map(a=>({...a}));saveApps()}notes=loadJSON(KEY_NOTES,[]);savedUrls=loadJSON(KEY_URLS,[]);if(!Array.isArray(notes))notes=[];if(!Array.isArray(savedUrls))savedUrls=[];renderApps()}
function renderApps(){const box=document.getElementById('appList');box.innerHTML=apps.map((a,i)=>`<button class="appbtn" data-i="${i}" onclick="openApp(${i})" oncontextmenu="showContext(event,${i})" ontouchstart="touchStart(event,${i})" ontouchend="touchEnd()" ontouchmove="touchCancel()">${getLogoSVG(a)}<span class="appname">${escapeHTML(a.name)}</span></button>`).join('');}
function openApp(i){if(longPressTriggered){longPressTriggered=false;return}const a=apps[i];if(a)window.open(a.url,'_blank','noopener,noreferrer')}
function openAddApp(){closeAllModals();renderLibrary();updateLimit();showModal('addOverlay');setTimeout(()=>document.getElementById('librarySearch').focus(),80)}
function updateLimit(){const t=apps.length+'/'+MAX_VISIBLE_APPS+' apps used';document.getElementById('appLimit').textContent=t;document.getElementById('manageLimit').textContent=t}
function renderLibrary(q=''){const box=document.getElementById('library');const x=(q||'').toLowerCase().trim();const list=BASE_APPS.filter(a=>!apps.some(c=>c.id===a.id)||a.custom).filter(a=>!x||a.name.toLowerCase().includes(x));box.innerHTML=list.map(a=>`<div class="libitem" onclick="addLibraryApp('${a.id}')">${getLogoSVG(a)}<div><strong>${escapeHTML(a.name)}</strong><small>${apps.some(c=>c.id===a.id)?'Added':'Add app'}</small></div></div>`).join('')||'<div class="empty">No apps found.</div>'}
function addLibraryApp(id){if(apps.length>=MAX_VISIBLE_APPS){toast('Remove an app first — maximum 5 apps');return}const a=BASE_APPS.find(x=>x.id===id);if(!a)return;if(apps.some(x=>x.id===id)){toast(a.name+' is already added');return}apps.push({...a});saveApps();renderApps();updateLimit();renderLibrary(document.getElementById('librarySearch').value);toast(a.name+' added')}
function addCustomApp(){if(apps.length>=MAX_VISIBLE_APPS){toast('Remove an app first — maximum 5 apps');return}const name=document.getElementById('customName').value.trim(),url=normalizeURL(document.getElementById('customUrl').value);if(!name){toast('Enter an app name');return}if(!url){toast('Enter a valid website URL');return}apps.push({id:'custom_'+Date.now(),name,url,custom:true});saveApps();renderApps();updateLimit();document.getElementById('customName').value='';document.getElementById('customUrl').value='';toast(name+' added')}
function openManageApps(){closeModal('settingsOverlay');renderManageApps();showModal('manageOverlay')}
function renderManageApps(){updateLimit();const box=document.getElementById('manageList');box.innerHTML=apps.map((a,i)=>`<div class="manage-item">${getLogoSVG(a)}<div class="manage-info"><strong>${escapeHTML(a.name)}</strong><small>${escapeHTML(a.url)}</small></div><button class="iconbtn" onclick="removeApp(${i})" title="Remove">×</button></div>`).join('')||'<div class="empty">No apps added. Use Add App.</div>'}
function removeApp(i){if(i<0||i>=apps.length)return;const n=apps[i].name;apps.splice(i,1);saveApps();renderApps();renderManageApps();hideContext();toast(n+' removed')}
function showContext(e,i){e.preventDefault();contextIndex=i;const c=document.getElementById('contextMenu');c.style.display='block';c.style.left=Math.min(e.clientX,innerWidth-170)+'px';c.style.top=Math.min(e.clientY,innerHeight-100)+'px'}
function contextOpen(){if(contextIndex>=0)openApp(contextIndex);hideContext()}function contextRemove(){if(contextIndex>=0)removeApp(contextIndex);hideContext()}function hideContext(){document.getElementById('contextMenu').style.display='none';contextIndex=-1}
function touchStart(e,i){longPressTriggered=false;clearTimeout(longPressTimer);longPressTimer=setTimeout(()=>{longPressTriggered=true;contextIndex=i;const t=e.touches[0],c=document.getElementById('contextMenu');c.style.display='block';c.style.left=Math.min(t.clientX,innerWidth-170)+'px';c.style.top=Math.min(t.clientY,innerHeight-100)+'px'},550)}
function touchEnd(){clearTimeout(longPressTimer)}function touchCancel(){clearTimeout(longPressTimer)}
function isDirectURL(q){const s=q.trim();return /^https?:\/\//i.test(s)||/^(www\.)?[a-z0-9-]+(\.[a-z0-9-]+)+(\/.*)?$/i.test(s)}
let searchTimer=null,searchToken=0;
function chromeSearch(){const q=document.getElementById('searchInput').value.trim();if(!q)return;if(isDirectURL(q)){const url=/^https?:\/\//i.test(q)?q:'https://'+q;window.open(url,'_blank','noopener,noreferrer');closeSearch();return}showSearchResults(q)}
function searchExternal(type,q){const u={google:'https://www.google.com/search?q=',bing:'https://www.bing.com/search?q=',news:'https://www.google.com/search?tbm=nws&q=',images:'https://www.google.com/search?tbm=isch&q=',youtube:'https://www.youtube.com/results?search_query=',github:'https://github.com/search?q='};window.open((u[type]||u.google)+encodeURIComponent(q),'_blank','noopener,noreferrer')}
function searchButtons(q){const x=escapeHTML(q).replace(/`/g,'');return '<div class="search-tools"><button class="search-tool" onclick="searchExternal(\'google\',\''+x+'\')">Google</button><button class="search-tool" onclick="searchExternal(\'bing\',\''+x+'\')">Bing</button><button class="search-tool" onclick="searchExternal(\'news\',\''+x+'\')">News</button><button class="search-tool" onclick="searchExternal(\'images\',\''+x+'\')">Images</button><button class="search-tool" onclick="searchExternal(\'youtube\',\''+x+'\')">YouTube</button><button class="search-tool" onclick="searchExternal(\'github\',\''+x+'\')">GitHub</button></div>'}
function showSearchResults(q){const panel=document.getElementById('searchPanel');panel.style.display='block';panel.innerHTML=searchButtons(q)+'<div class="search-loading">Searching for details…</div>';const token=++searchToken;Promise.allSettled([fetch('https://api.duckduckgo.com/?q='+encodeURIComponent(q)+'&format=json&no_html=1&skip_disambig=0').then(r=>r.json()),fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(q.replace(/\s+/g,'_'))).then(r=>r.ok?r.json():null)]).then(rs=>{if(token!==searchToken)return;const dd=rs[0].status==='fulfilled'?rs[0].value:null,wp=rs[1].status==='fulfilled'?rs[1].value:null;let h=searchButtons(q);const l=q.toLowerCase(),cur=apps.filter(a=>a.name.toLowerCase().includes(l)),lib=BASE_APPS.filter(a=>a.name.toLowerCase().includes(l)&&!cur.some(c=>c.id===a.id)).slice(0,7);if(cur.length||lib.length){h+='<div class="search-section">LOOPIN APPS</div>';cur.forEach(a=>h+='<div class="search-row" onclick="openSearchURL(\''+a.id+'\')">'+getLogoSVG(a)+'<div><div class="search-name">'+escapeHTML(a.name)+'</div><div class="search-url">Open app shortcut</div></div></div>');lib.forEach(a=>h+='<div class="search-row" onclick="openSearchURL(\''+a.id+'\')">'+getLogoSVG(a)+'<div><div class="search-name">'+escapeHTML(a.name)+'</div><div class="search-url">'+escapeHTML(a.url)+'</div></div></div>')}if(wp&&wp.title){h+='<div class="search-section">KNOWLEDGE</div><div class="result-card"><div class="result-title">'+escapeHTML(wp.title)+'</div><div class="result-link">Wikipedia</div><div class="result-text">'+escapeHTML(wp.extract||'')+'</div><div class="result-actions"><a href="'+escapeHTML((wp.content_urls&&wp.content_urls.desktop&&wp.content_urls.desktop.page)||'#')+'" target="_blank" rel="noopener">Read full article</a></div></div>'}if(dd&&(dd.AbstractText||dd.Answer)){h+='<div class="search-section">WEB DETAILS</div><div class="result-card"><div class="result-title">'+escapeHTML(dd.Heading||q)+'</div><div class="result-link">'+escapeHTML(dd.AbstractSource||'Web result')+'</div><div class="result-text">'+escapeHTML(dd.Answer||dd.AbstractText||'')+'</div>'+(dd.AbstractURL?'<div class="result-actions"><a href="'+escapeHTML(dd.AbstractURL)+'" target="_blank" rel="noopener">Open source</a></div>':'')+'</div>'}h+='<div class="result-card"><div class="result-title">Full web results</div><div class="result-text">For the complete live Chrome-style results, including current websites, pages, images, news and videos, choose a search engine below.</div><div class="result-actions"><a href="https://www.google.com/search?q='+encodeURIComponent(q)+'" target="_blank" rel="noopener">Google</a><a href="https://www.bing.com/search?q='+encodeURIComponent(q)+'" target="_blank" rel="noopener">Bing</a></div></div>';panel.innerHTML=h}).catch(()=>{panel.innerHTML=searchButtons(q)+'<div class="result-card"><div class="result-title">Search unavailable</div><div class="result-text">Open Google to see live web results.</div><div class="result-actions"><a href="https://www.google.com/search?q='+encodeURIComponent(q)+'" target="_blank" rel="noopener">Google Search</a></div></div>'})}
function handleSearch(v){const q=v.trim(),panel=document.getElementById('searchPanel');document.getElementById('searchClear').style.display=q?'block':'none';clearTimeout(searchTimer);if(!q){panel.style.display='none';panel.innerHTML='';return}const l=q.toLowerCase(),cur=apps.filter(a=>a.name.toLowerCase().includes(l)),lib=BASE_APPS.filter(a=>a.name.toLowerCase().includes(l)&&!cur.some(c=>c.id===a.id)).slice(0,7);let h=searchButtons(q);h+='<div class="search-row" onclick="chromeSearch()">'+LOGOS.google+'<div><div class="search-name">'+(isDirectURL(q)?'Open '+escapeHTML(q):'Search for “'+escapeHTML(q)+'”')+'</div><div class="search-url">'+(isDirectURL(q)?'Website':'Get web details')+'</div></div></div>';cur.forEach(a=>h+='<div class="search-row" onclick="openSearchURL(\''+a.id+'\')">'+getLogoSVG(a)+'<div><div class="search-name">'+escapeHTML(a.name)+'</div><div class="search-url">Open app shortcut</div></div></div>');lib.forEach(a=>h+='<div class="search-row" onclick="openSearchURL(\''+a.id+'\')">'+getLogoSVG(a)+'<div><div class="search-name">'+escapeHTML(a.name)+'</div><div class="search-url">'+escapeHTML(a.url)+'</div></div></div>');panel.innerHTML=h;panel.style.display='block';if(!isDirectURL(q))searchTimer=setTimeout(()=>showSearchResults(q),500)}
function openSearchURL(id){const a=apps.find(x=>x.id===id)||BASE_APPS.find(x=>x.id===id);if(a)window.open(a.url,'_blank','noopener,noreferrer');closeSearch()}
function webSearch(){chromeSearch()}
function clearSearch(){document.getElementById('searchInput').value='';closeSearch();document.getElementById('searchInput').focus()}
function closeSearch(){document.getElementById('searchPanel').style.display='none';document.getElementById('searchClear').style.display='none'}
function openNotes(){closeAllModals();renderNotes();showModal('notesOverlay')}
function renderNotes(){const b=document.getElementById('notesList');if(!notes.length){b.innerHTML='<div class="empty">No notes yet.<br>Create your first note.</div>';return}b.innerHTML=notes.slice().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).map(n=>`<div class="note-item" onclick="editNote('${n.id}')"><div class="item-row"><div class="note-title">${escapeHTML(n.title||'Untitled Note')}</div><button class="iconbtn" onclick="event.stopPropagation();deleteNote('${n.id}')">×</button></div><div class="note-body">${escapeHTML(n.body||'')}</div><div class="meta">${new Date(n.updatedAt||Date.now()).toLocaleString()}</div></div>`).join('')}
function newNote(){editingNoteId=null;document.getElementById('noteEditorTitle').textContent='New Note';document.getElementById('noteTitle').value='';document.getElementById('noteBody').value='';showModal('noteEditorOverlay');setTimeout(()=>document.getElementById('noteTitle').focus(),80)}
function editNote(id){const n=notes.find(x=>String(x.id)===String(id));if(!n)return;editingNoteId=id;document.getElementById('noteEditorTitle').textContent='Edit Note';document.getElementById('noteTitle').value=n.title||'';document.getElementById('noteBody').value=n.body||'';showModal('noteEditorOverlay')}
function saveCurrentNote(){const title=document.getElementById('noteTitle').value.trim(),body=document.getElementById('noteBody').value.trim();if(!title&&!body){toast('Write something first');return}if(editingNoteId){const n=notes.find(x=>String(x.id)===String(editingNoteId));if(n){n.title=title||'Untitled Note';n.body=body;n.updatedAt=Date.now()}}else notes.push({id:String(Date.now())+Math.random().toString(36).slice(2),title:title||'Untitled Note',body,updatedAt:Date.now()});saveNotes();closeModal('noteEditorOverlay');renderNotes();toast('Note saved')}
function deleteNote(id){if(!confirm('Delete this note?'))return;notes=notes.filter(n=>String(n.id)!==String(id));saveNotes();renderNotes();toast('Note deleted')}
function openSaved(){closeAllModals();renderUrls();showModal('savedOverlay')}
function renderUrls(){const b=document.getElementById('urlsList');if(!savedUrls.length){b.innerHTML='<div class="empty">No saved URLs yet.</div>';return}b.innerHTML=savedUrls.slice().reverse().map(x=>`<div class="url-item"><div class="item-row"><div><div class="note-title">${escapeHTML(x.name||'Saved URL')}</div><div class="note-body">${escapeHTML(x.url)}</div></div><div><button class="iconbtn" onclick="window.open('${escapeHTML(x.url)}','_blank','noopener,noreferrer')">Open</button> <button class="iconbtn" onclick="deleteUrl('${x.id}')">×</button></div></div></div>`).join('')}
function saveUrl(){const raw=document.getElementById('saveUrlInput').value.trim(),url=normalizeURL(raw),name=document.getElementById('saveUrlName').value.trim()||(url?new URL(url).hostname:'');if(!url){toast('Enter a valid URL');return}if(savedUrls.some(x=>x.url===url)){toast('URL already saved');return}savedUrls.push({id:String(Date.now())+Math.random().toString(36).slice(2),name,url});saveUrls();document.getElementById('saveUrlInput').value='';document.getElementById('saveUrlName').value='';renderUrls();toast('URL saved')}
function deleteUrl(id){savedUrls=savedUrls.filter(x=>String(x.id)!==String(id));saveUrls();renderUrls();toast('URL removed')}
function openSettings(){closeAllModals();showModal('settingsOverlay')}
function resetLoopin(){if(!confirm('Reset LOOPIN? This restores the original apps and clears notes and saved URLs.'))return;apps=DEFAULT_APPS.map(a=>({...a}));notes=[];savedUrls=[];saveApps();saveNotes();saveUrls();renderApps();closeAllModals();hideContext();toast('LOOPIN has been reset')}
function showModal(id){const e=document.getElementById(id);if(e)e.style.display='flex'}function closeModal(id){const e=document.getElementById(id);if(e)e.style.display='none'}function closeAllModals(){['addOverlay','notesOverlay','noteEditorOverlay','savedOverlay','settingsOverlay','manageOverlay'].forEach(closeModal)}function overlayClose(e,id){if(e.target===e.currentTarget)closeModal(id)}function goHome(){closeAllModals();hideContext();clearSearch();window.scrollTo(0,0)}
document.addEventListener('click',e=>{if(!e.target.closest('.appbtn')&&!e.target.closest('#contextMenu'))hideContext();if(!e.target.closest('.searchwrap'))closeSearch()});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('searchInput').focus();document.getElementById('searchInput').select()}if(e.key==='Escape'){closeSearch();hideContext();closeAllModals()}});window.addEventListener('resize',hideContext);init();
</script>
</body></html>
