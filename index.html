<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>LOOPIN</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
}

body{
  font-family:Inter,Arial,Helvetica,sans-serif;
  background:#fff;
  color:#111;
  overflow:hidden;
}

button,input,textarea{
  font-family:inherit;
}

.app{
  width:100%;
  height:100vh;
  display:flex;
  background:#fff;
}

/* ================= SIDEBAR ================= */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:92px;
  background:#fff;
  border-right:1px solid #e8e8e8;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:16px 7px 10px;
  z-index:100;
  overflow:hidden;
}

.brand{
  width:52px;
  height:52px;
  flex:none;
  cursor:pointer;
  margin-bottom:15px;
}

.brand svg{
  width:100%;
  height:100%;
  display:block;
}

.apps{
  width:100%;
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
  padding:3px 0 8px;
}

.apps::-webkit-scrollbar{
  display:none;
}

.app-item{
  width:68px;
  min-height:67px;
  border:0;
  background:#fff;
  border-radius:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  position:relative;
  transition:.16s;
  flex:none;
}

.app-item:hover{
  background:#f5f5f5;
}

.app-item:active{
  transform:scale(.96);
}

/* SHARP SVG LOGO */

.app-logo{
  width:35px;
  height:35px;
  display:block;
  object-fit:contain;
  margin-bottom:4px;
  flex:none;
}

.app-fallback{
  width:35px;
  height:35px;
  border-radius:9px;
  background:#111;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:700;
  margin-bottom:4px;
  flex:none;
}

.app-name{
  width:65px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  text-align:center;
  font-size:9px;
  color:#555;
  line-height:11px;
}

.add-app{
  width:68px;
  min-height:54px;
  flex:none;
  border:1px dashed #cfcfcf;
  background:#fff;
  border-radius:14px;
  color:#333;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  margin:2px 0 8px;
}

.add-app:hover{
  background:#f7f7f7;
}

.add-plus{
  font-size:22px;
  line-height:20px;
}

.add-text{
  font-size:9px;
  margin-top:3px;
}

.sidebar-bottom{
  width:100%;
  flex:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  padding-bottom:4px;
  transform:translateY(-12px);
}

.side-action{
  width:68px;
  height:39px;
  border:0;
  background:#fff;
  border-radius:12px;
  color:#555;
  font-size:10px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
}

.side-action:hover{
  background:#f5f5f5;
  color:#111;
}

.side-action span{
  font-size:16px;
}

/* ================= WORKSPACE ================= */

.workspace{
  margin-left:92px;
  width:calc(100% - 92px);
  height:100vh;
  position:relative;
  background:#fff;
}

/* ================= SEARCH ================= */

.top-search{
  position:absolute;
  top:22px;
  left:50%;
  transform:translateX(-50%);
  width:min(700px,calc(100% - 50px));
  z-index:20;
}

.top-search-inner{
  width:100%;
  height:54px;
  border:1px solid #dedede;
  border-radius:17px;
  background:#fff;
  display:flex;
  align-items:center;
  padding:0 7px 0 17px;
  box-shadow:0 5px 20px rgba(0,0,0,.045);
  transition:.2s;
}

.top-search-inner:focus-within{
  border-color:#c8c8c8;
  box-shadow:0 8px 28px rgba(0,0,0,.07);
}

.search-icon{
  font-size:23px;
  color:#777;
  margin-right:10px;
  line-height:1;
}

.top-search-inner input{
  flex:1;
  width:100%;
  height:100%;
  border:0;
  outline:0;
  background:#fff;
  color:#111;
  font-size:14px;
}

.top-search-inner input::placeholder{
  color:#999;
}

.top-search-inner button{
  width:40px;
  height:40px;
  border:1px solid #dedede;
  border-radius:12px;
  background:#fff;
  color:#111;
  font-size:21px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.18s;
}

.top-search-inner button:hover{
  background:#f5f5f5;
  border-color:#c9c9c9;
}

/* ================= MODALS ================= */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.25);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:500;
}

.modal{
  width:min(620px,100%);
  max-height:88vh;
  overflow:hidden;
  background:#fff;
  border:1px solid #e5e5e5;
  border-radius:22px;
  box-shadow:0 25px 80px rgba(0,0,0,.18);
}

.modal-head{
  height:64px;
  padding:0 18px 0 22px;
  border-bottom:1px solid #eee;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.modal-title{
  font-size:17px;
  font-weight:700;
}

.close{
  width:35px;
  height:35px;
  border:0;
  border-radius:11px;
  background:#f5f5f5;
  color:#333;
  font-size:22px;
  cursor:pointer;
}

.close:hover{
  background:#ebebeb;
}

.modal-body{
  padding:18px;
  max-height:calc(88vh - 64px);
  overflow:auto;
}

/* ================= ADD APP ================= */

.library-search{
  width:100%;
  height:45px;
  border:1px solid #ddd;
  border-radius:13px;
  outline:0;
  padding:0 13px;
  font-size:13px;
  margin-bottom:13px;
}

.library-search:focus{
  border-color:#aaa;
}

.library{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  max-height:55vh;
  overflow:auto;
}

.library-item{
  min-height:59px;
  border:1px solid #eee;
  background:#fff;
  border-radius:14px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 10px;
  cursor:pointer;
}

.library-item:hover{
  background:#f7f7f7;
}

.library-logo{
  width:34px;
  height:34px;
  object-fit:contain;
  flex:none;
}

.library-fallback{
  width:34px;
  height:34px;
  border-radius:9px;
  background:#111;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:700;
  flex:none;
}

.library-name{
  font-size:12px;
  color:#222;
}

/* ================= INPUTS ================= */

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  font-size:11px;
  color:#666;
  margin-bottom:6px;
}

.field input,
.field textarea{
  width:100%;
  border:1px solid #ddd;
  border-radius:12px;
  padding:11px 12px;
  outline:0;
  font-size:13px;
  color:#111;
  background:#fff;
}

.field textarea{
  min-height:220px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus{
  border-color:#aaa;
}

.primary{
  height:43px;
  width:100%;
  border:0;
  border-radius:12px;
  background:#111;
  color:#fff;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}

.primary:hover{
  background:#2a2a2a;
}

.secondary{
  height:42px;
  border:1px solid #ddd;
  background:#fff;
  color:#222;
  border-radius:12px;
  padding:0 15px;
  cursor:pointer;
}

/* ================= URLS ================= */

.url-add{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

.url-add input{
  flex:1;
  height:43px;
  border:1px solid #ddd;
  border-radius:12px;
  outline:0;
  padding:0 12px;
}

.url-add button{
  height:43px;
  padding:0 14px;
  border:0;
  border-radius:12px;
  background:#111;
  color:#fff;
  cursor:pointer;
}

.url-row{
  border:1px solid #eee;
  border-radius:13px;
  padding:11px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.url-info{
  min-width:0;
}

.url-title{
  font-size:12px;
  font-weight:600;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.url-link{
  font-size:10px;
  color:#888;
  margin-top:3px;
}

.url-actions{
  display:flex;
  gap:5px;
  flex:none;
}

.small-btn{
  height:32px;
  padding:0 9px;
  border:1px solid #ddd;
  background:#fff;
  border-radius:9px;
  font-size:10px;
  cursor:pointer;
}

.small-btn:hover{
  background:#f5f5f5;
}

.danger{
  color:#c62828;
}

/* ================= SETTINGS ================= */

.setting-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.setting-btn{
  width:100%;
  min-height:50px;
  border:1px solid #eee;
  background:#fff;
  border-radius:13px;
  text-align:left;
  padding:0 14px;
  cursor:pointer;
  font-size:12px;
}

.setting-btn:hover{
  background:#f7f7f7;
}

/* ================= MANAGE ================= */

.manage-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.manage-row{
  min-height:55px;
  border:1px solid #eee;
  border-radius:13px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px;
}

.manage-logo{
  width:34px;
  height:34px;
  object-fit:contain;
  flex:none;
}

.manage-fallback{
  width:34px;
  height:34px;
  border-radius:9px;
  background:#111;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:700;
}

.manage-name{
  flex:1;
  font-size:12px;
}

/* ================= CONTEXT ================= */

.context-menu{
  position:fixed;
  display:none;
  width:165px;
  background:#fff;
  border:1px solid #e5e5e5;
  border-radius:13px;
  box-shadow:0 15px 45px rgba(0,0,0,.15);
  padding:5px;
  z-index:1000;
}

.context-menu button{
  width:100%;
  height:38px;
  border:0;
  background:#fff;
  border-radius:9px;
  text-align:left;
  padding:0 10px;
  font-size:11px;
  cursor:pointer;
}

.context-menu button:hover{
  background:#f5f5f5;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translateX(-50%) translateY(20px);
  background:#111;
  color:#fff;
  border-radius:12px;
  padding:10px 15px;
  font-size:11px;
  opacity:0;
  pointer-events:none;
  transition:.22s;
  z-index:2000;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  .sidebar{
    width:78px;
    padding:12px 5px 8px;
  }

  .brand{
    width:47px;
    height:47px;
    margin-bottom:10px;
  }

  .app-item,
  .add-app,
  .side-action{
    width:62px;
  }

  .app-item{
    min-height:62px;
  }

  .app-logo,
  .app-fallback{
    width:32px;
    height:32px;
  }

  .app-name{
    width:58px;
    font-size:8px;
  }

  .sidebar-bottom{
    transform:translateY(-8px);
    gap:4px;
  }

  .side-action{
    height:35px;
    font-size:8px;
  }

  .side-action span{
    font-size:14px;
  }

  .workspace{
    margin-left:78px;
    width:calc(100% - 78px);
  }

  .top-search{
    top:14px;
    width:calc(100% - 25px);
  }

  .top-search-inner{
    height:48px;
    border-radius:15px;
    padding-left:13px;
  }

  .top-search-inner input{
    font-size:12px;
  }

  .top-search-inner button{
    width:36px;
    height:36px;
    border-radius:10px;
  }

  .library{
    grid-template-columns:1fr;
  }

  .modal{
    border-radius:18px;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- ================= SIDEBAR ================= -->

<aside class="sidebar">

  <div class="brand" title="LOOPIN">
    <svg viewBox="0 0 52 52">
      <defs>
        <linearGradient id="loopinGradient" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#111"/>
          <stop offset="1" stop-color="#3b3b3b"/>
        </linearGradient>
      </defs>

      <rect x="2" y="2" width="48" height="48"
            rx="15"
            fill="url(#loopinGradient)"/>

      <path
        d="M17 14V30.5C17 36.2 20.2 40 25.3 40C30.6 40 35 36.2 35 30.3V19C35 16.1 33.1 14 30.7 14C28.2 14 26.4 16.1 26.4 19V29.8C26.4 31.5 25.9 32.2 24.9 32.2C23.8 32.2 23.3 31.5 23.3 29.8V14"
        fill="none"
        stroke="#fff"
        stroke-width="3.7"
        stroke-linecap="round"
        stroke-linejoin="round"/>

      <circle cx="36" cy="36" r="2.3" fill="#fff"/>
    </svg>
  </div>

  <div class="apps" id="apps"></div>

  <button class="add-app" onclick="openAddApp()">
    <div class="add-plus">+</div>
    <div class="add-text">Add App</div>
  </button>

  <div class="sidebar-bottom">

    <button class="side-action" onclick="openNotes()">
      <span>✎</span>
      <b>Notes</b>
    </button>

    <button class="side-action" onclick="openURLs()">
      <span>🔗</span>
      <b>Saved</b>
    </button>

    <button class="side-action" onclick="openSettings()">
      <span>⚙</span>
      <b>Settings</b>
    </button>

  </div>

</aside>


<!-- ================= WORKSPACE ================= -->

<main class="workspace">

  <div class="top-search">

    <div class="top-search-inner">

      <span class="search-icon">⌕</span>

      <input
        id="globalSearch"
        type="text"
        placeholder="Search movies, news, apps, anything..."
        autocomplete="off"
      >

      <button onclick="doGoogleSearch()" title="Search">→</button>

    </div>

  </div>

</main>

</div>


<!-- ================= ADD APP ================= -->

<div class="overlay" id="addOverlay">

  <div class="modal">

    <div class="modal-head">

      <div class="modal-title">Add App</div>

      <button class="close"
              onclick="closeModal('addOverlay')">×</button>

    </div>

    <div class="modal-body">

      <input
        id="librarySearch"
        class="library-search"
        placeholder="Search apps..."
        autocomplete="off"
      >

      <div id="library" class="library"></div>

      <div style="height:15px"></div>

      <div class="field">
        <label>Custom App Name</label>
        <input id="customName" placeholder="Example: My Website">
      </div>

      <div class="field">
        <label>Custom App URL</label>
        <input id="customURL" placeholder="https://example.com">
      </div>

      <button class="primary" onclick="addCustomApp()">
        Add Custom App
      </button>

    </div>

  </div>

</div>


<!-- ================= NOTES ================= -->

<div class="overlay" id="notesOverlay">

  <div class="modal">

    <div class="modal-head">

      <div class="modal-title">Notepad</div>

      <button class="close"
              onclick="closeModal('notesOverlay')">×</button>

    </div>

    <div class="modal-body">

      <div class="field">

        <textarea
          id="noteText"
          placeholder="Write your notes here..."
        ></textarea>

      </div>

      <div style="display:flex;gap:8px">

        <button class="primary" onclick="saveNote">
          Save Note
        </button>

        <button class="secondary" onclick="clearNote()">
          Clear
        </button>

      </div>

    </div>

  </div>

</div>


<!-- ================= SAVED URLS ================= -->

<div class="overlay" id="urlsOverlay">

  <div class="modal">

    <div class="modal-head">

      <div class="modal-title">Saved URLs</div>

      <button class="close"
              onclick="closeModal('urlsOverlay')">×</button>

    </div>

    <div class="modal-body">

      <div class="url-add">

        <input id="urlInput"
               placeholder="Paste URL...">

        <button onclick="saveURL()">Save</button>

      </div>

      <div id="urlList"></div>

      <div style="margin-top:12px">

        <button class="secondary"
                onclick="clearURLs()">
          Clear All
        </button>

      </div>

    </div>

  </div>

</div>


<!-- ================= SETTINGS ================= -->

<div class="overlay" id="settingsOverlay">

  <div class="modal">

    <div class="modal-head">

      <div class="modal-title">Settings</div>

      <button class="close"
              onclick="closeModal('settingsOverlay')">×</button>

    </div>

    <div class="modal-body">

      <div class="setting-list">

        <button class="setting-btn"
                onclick="openManageApps()">

          <b>Manage Apps</b><br>

          <span style="color:#888">
            Remove apps from LOOPIN
          </span>

        </button>

        <button class="setting-btn"
                onclick="resetLoopin()">

          <b>Reset LOOPIN</b><br>

          <span style="color:#888">
            Restore default apps and clear local data
          </span>

        </button>

      </div>

    </div>

  </div>

</div>


<!-- ================= MANAGE ================= -->

<div class="overlay" id="manageOverlay">

  <div class="modal">

    <div class="modal-head">

      <div class="modal-title">Manage Apps</div>

      <button class="close"
              onclick="closeModal('manageOverlay')">×</button>

    </div>

    <div class="modal-body">

      <div id="manageList"
           class="manage-list"></div>

    </div>

  </div>

</div>


<div class="context-menu" id="contextMenu">

  <button onclick="contextOpen()">
    Open App
  </button>

  <button onclick="contextRemove()">
    Remove App
  </button>

</div>

<div class="toast" id="toast"></div>


<script>

/* =========================================================
   STORAGE
========================================================= */

const KEY_APPS = "loopin_apps_svg_final_v1";
const KEY_NOTE = "loopin_note_svg_final_v1";
const KEY_URLS = "loopin_urls_svg_final_v1";

const MAX_VISIBLE_APPS = 5;

const DEFAULT_IDS = [
  "whatsapp",
  "instagram",
  "gmail",
  "youtube",
  "chatgpt"
];


/* =========================================================
   SVG LOGO LIBRARY
========================================================= */

const LOGOS = {

whatsapp:`
<svg viewBox="0 0 64 64">
<circle cx="32" cy="32" r="29" fill="#25D366"/>
<path d="M18 47l3-9a17 17 0 1 1 7 6l-10 3z" fill="#fff"/>
<path d="M25 23c-1 0-2 1-2 3 0 5 7 13 13 14 2 0 3-1 4-3l-2-2-3-1-2 2c-3-1-6-4-7-7l2-2-1-3-2-1z" fill="#25D366"/>
</svg>`,

instagram:`
<svg viewBox="0 0 64 64">
<defs>
<linearGradient id="ig" x1="0" y1="1" x2="1" y2="0">
<stop offset="0" stop-color="#F58529"/>
<stop offset=".45" stop-color="#DD2A7B"/>
<stop offset="1" stop-color="#8134AF"/>
</linearGradient>
</defs>
<rect x="7" y="7" width="50" height="50" rx="15" fill="url(#ig)"/>
<rect x="18" y="18" width="28" height="28" rx="9" fill="none" stroke="#fff" stroke-width="4"/>
<circle cx="32" cy="32" r="7" fill="none" stroke="#fff" stroke-width="4"/>
<circle cx="45" cy="19" r="3" fill="#fff"/>
</svg>`,

gmail:`
<svg viewBox="0 0 64 64">
<rect x="7" y="13" width="50" height="39" rx="5" fill="#fff"/>
<path d="M8 18l24 18 24-18" fill="none" stroke="#EA4335" stroke-width="6"/>
<path d="M8 18v31" stroke="#4285F4" stroke-width="6"/>
<path d="M56 18v31" stroke="#34A853" stroke-width="6"/>
<path d="M8 49V18l24 18 24-18v31" fill="none" stroke="#FBBC04" stroke-width="0"/>
</svg>`,

youtube:`
<svg viewBox="0 0 64 64">
<rect x="6" y="14" width="52" height="36" rx="10" fill="#FF0000"/>
<path d="M27 23l16 9-16 9z" fill="#fff"/>
</svg>`,

chatgpt:`

  APP_LIBRARY.push([
    "search_"+i,
    keyword+" "+i,
    "https://www.google.com/search?q="+
    encodeURIComponent(keyword)
  ]);

}


/* =========================================================
   STATE
========================================================= */

let apps=[];
let contextIndex=-1;
let contextTimer=null;


/* =========================================================
   APP HELPERS
========================================================= */

function makeApp(row){

  return {
    id:row[0],
    name:row[1],
    url:row[2]
  };

}

function findLibraryApp(id){

  return APP_LIBRARY.find(
    x=>x[0]===id
  );

}

function safeURL(url){

  if(!url)return "#";

  if(/^https?:\/\//i.test(url))
    return url;

  return "https://"+url;

}


/* =========================================================
   CLEAR SVG LOGOS
========================================================= */

function getLogoSVG(app){

  if(LOGOS[app.id])
    return LOGOS[app.id];

  return fallbackSVG(app.name);

}

function initials(name){

  const words =
    String(name||"APP")
    .replace(/[^a-zA-Z0-9 ]/g," ")
    .trim()
    .split(/\s+/)
    .filter(Boolean);

  if(words.length>=2){

    return (
      words[0][0]+
      words[1][0]
    ).toUpperCase();

  }

  return String(name||"APP")
    .slice(0,2)
    .toUpperCase();

}

function fallbackSVG(name){

  const text=escapeHTML(initials(name));

  return `
  <svg viewBox="0 0 64 64">
    <rect x="4" y="4"
          width="56"
          height="56"
          rx="15"
          fill="#111"/>
    <text
      x="32"
      y="38"
      text-anchor="middle"
      font-family="Arial"
      font-size="20"
      font-weight="700"
      fill="#fff">${text}</text>
  </svg>`;
}


/* =========================================================
   APP LOGO
========================================================= */

function appLogoHTML(app){

  return `
    <div
      class="app-logo"
      aria-label="${escapeAttr(app.name)}"
      title="${escapeAttr(app.name)}"
    >
      ${getLogoSVG(app)}
    </div>
  `;

}


/* =========================================================
   LOAD
========================================================= */

function loadApps(){

  try{

    const raw=
      localStorage.getItem(KEY_APPS);

    if(raw){

      const parsed=
        JSON.parse(raw);

      if(Array.isArray(parsed)){

        apps=
          parsed
          .filter(x=>
            x &&
            x.id &&
            x.name &&
            x.url
          )
          .slice(0,MAX_VISIBLE_APPS);

      }

    }

  }catch(e){

    apps=[];

  }

  if(!apps.length){

    apps=
      DEFAULT_IDS
      .map(findLibraryApp)
      .filter(Boolean)
      .map(makeApp);

  }

  fillNextApps();
  saveApps();

}

function saveApps(){

  localStorage.setItem(
    KEY_APPS,
    JSON.stringify(apps)
  );

}

function fillNextApps(){

  const used=
    new Set(
      apps.map(a=>a.id)
    );

  for(const row of APP_LIBRARY){

    if(
      apps.length>=
      MAX_VISIBLE_APPS
    ) break;

    if(!used.has(row[0])){

      apps.push(makeApp(row));
      used.add(row[0]);

    }

  }

}


/* =========================================================
   RENDER
========================================================= */

function renderApps(){

  const box=
    document.getElementById("apps");

  box.innerHTML="";

  apps.forEach((app,index)=>{

    const button=
      document.createElement("button");

    button.className="app-item";

    button.title=app.name;

    button.innerHTML=
      appLogoHTML(app)+
      `
      <div class="app-name">
        ${escapeHTML(app.name)}
      </div>
      `;

    button.onclick=
      ()=>openApp(index);

    button.addEventListener(
      "contextmenu",
      function(e){

        e.preventDefault();

        showContextMenu(
          e.clientX,
          e.clientY,
          index
        );

      }
    );

    button.addEventListener(
      "touchstart",
      function(){

        contextTimer=
          setTimeout(()=>{

            showContextMenu(
              window.innerWidth/2,
              window.innerHeight/2,
              index
            );

          },650);

      },
      {passive:true}
    );

    button.addEventListener(
      "touchend",
      clearContextTimer
    );

    button.addEventListener(
      "touchmove",
      clearContextTimer
    );

    box.appendChild(button);

  });

}


/* =========================================================
   OPEN
========================================================= */

function openApp(index){

  if(
    index<0 ||
    index>=apps.length
  ) return;

  window.open(
    safeURL(apps[index].url),
    "_blank",
    "noopener"
  );

}


/* =========================================================
   ADD APP
========================================================= */

function openAddApp(){

  document.getElementById(
    "addOverlay"
  ).style.display="flex";

  document.getElementById(
    "librarySearch"
  ).value="";

  renderLibrary();

}

function renderLibrary(){

  const query=
    document.getElementById(
      "librarySearch"
    ).value
    .trim()
    .toLowerCase();

  const box=
    document.getElementById("library");

  const used=
    new Set(
      apps.map(a=>a.id)
    );

  const rows=
    APP_LIBRARY
    .filter(row=>{

      if(used.has(row[0]))
        return false;

      if(!query)
        return true;

      return row[1]
        .toLowerCase()
        .includes(query);

    })
    .slice(0,150);

  box.innerHTML="";

  if(!rows.length){

    box.innerHTML=`
      <div style="
        grid-column:1/-1;
        text-align:center;
        padding:25px;
        color:#888;
        font-size:12px;
      ">
        No apps found
      </div>
    `;

    return;

  }

  rows.forEach(row=>{

    const item=
      document.createElement("div");

    item.className="library-item";

    const temp=makeApp(row);

    item.innerHTML=`

      <div class="library-logo">
        ${getLogoSVG(temp)}
      </div>

      <div class="library-name">
        ${escapeHTML(row[1])}
      </div>

    `;

    item.onclick=
      ()=>addLibraryApp(row[0]);

    box.appendChild(item);

  });

}


function addLibraryApp(id){

  const row=
    findLibraryApp(id);

  if(!row)return;

  const newApp=
    makeApp(row);

  apps=
    apps.filter(
      a=>a.id!==id
    );

  if(
    apps.length>=
    MAX_VISIBLE_APPS
  ){

    apps.pop();

  }

  apps.push(newApp);

  fillNextApps();

  saveApps();
  renderApps();

  closeModal("addOverlay");

  toast(
    row[1]+" added"
  );

}


/* =========================================================
   CUSTOM
========================================================= */

function addCustomApp(){

  const name=
    document.getElementById(
      "customName"
    ).value.trim();

  let url=
    document.getElementById(
      "customURL"
    ).value.trim();

  if(!name){

    toast("Enter app name");
    return;

  }

  if(!url){

    toast("Enter app URL");
    return;

  }

  url=safeURL(url);

  const newApp={
    id:"custom_"+Date.now(),
    name,
    url
  };

  if(
    apps.length>=
    MAX_VISIBLE_APPS
  ){

    apps.pop();

  }

  apps.push(newApp);

  saveApps();
  renderApps();

  document.getElementById(
    "customName"
  ).value="";

  document.getElementById(
    "customURL"
  ).value="";

  closeModal("addOverlay");

  toast(name+" added");

}


/* =========================================================
   REMOVE
========================================================= */

function removeApp(index){

  if(
    index<0 ||
    index>=apps.length
  ) return;

  const name=
    apps[index].name;

  apps.splice(index,1);

  fillNextApps();

  saveApps();
  renderApps();

  toast(name+" removed");

}


/* =========================================================
   CONTEXT
========================================================= */

function showContextMenu(x,y,index){

  contextIndex=index;

  const menu=
    document.getElementById(
      "contextMenu"
    );

  menu.style.display="block";

  const maxX=
    window.innerWidth-
    menu.offsetWidth-
    8;

  const maxY=
    window.innerHeight-
    menu.offsetHeight-
    8;

  menu.style.left=
    Math.min(x,maxX)+"px";

  menu.style.top=
    Math.min(y,maxY)+"px";

}

function hideContextMenu(){

  document.getElementById(
    "contextMenu"
  ).style.display="none";

  contextIndex=-1;

}

function contextOpen(){

  if(contextIndex>=0)
    openApp(contextIndex);

  hideContextMenu();

}

function contextRemove(){

  if(contextIndex>=0)
    removeApp(contextIndex);

  hideContextMenu();

}

function clearContextTimer(){

  if(contextTimer){

    clearTimeout(contextTimer);
    contextTimer=null;

  }

}


/* =========================================================
   GOOGLE SEARCH
========================================================= */

function doGoogleSearch(){

  const input=
    document.getElementById(
      "globalSearch"
    );

  const query=
    input.value.trim();

  if(!query){

    input.focus();
    return;

  }

  window.open(
    "https://www.google.com/search?q="+
    encodeURIComponent(query),
    "_blank",
    "noopener"
  );

  input.value="";

}

document
.getElementById("globalSearch")
.addEventListener(
  "keydown",
  function(e){

    if(e.key==="Enter"){

      e.preventDefault();
      doGoogleSearch();

    }

  }
);


/* =========================================================
   NOTES
========================================================= */

function openNotes(){

    "noteText"
  ).value=

  document.getElementById(

function saveNote(){

function clearNote(){

/* =========================================================
   URLS
========================================================= */

function getURLs(){

  try{

    const data=
      JSON.parse(
        localStorage.getItem(
          KEY_URLS
        )||"[]"
      );

    return Array.isArray(data)
      ?data
      :[];

  }catch(e){

    return [];

  }

}

function saveURLs(data){

  localStorage.setItem(
    KEY_URLS,
    JSON.stringify(data)
  );

}

function openURLs(){

  renderURLs();

  document.getElementById(
    "urlsOverlay"
  ).style.display="flex";

}

function saveURL(){

  let url=
    document.getElementById(
      "urlInput"
    ).value.trim();

  if(!url){

    toast("Enter URL");
    return;

  }

  url=safeURL(url);

  const urls=getURLs();

  urls.unshift({
    id:Date.now(),
    url
  });

  saveURLs(urls);

  document.getElementById(
    "urlInput"
  ).value="";

  renderURLs();

  toast("URL saved");

}

function renderURLs(){

  const box=
    document.getElementById(
      "urlList"
    );

  const urls=getURLs();

  box.innerHTML="";

  if(!urls.length){

    box.innerHTML=`
      <div style="
        padding:30px 10px;
        text-align:center;
        color:#999;
        font-size:12px;
      ">
        No saved URLs
      </div>
    `;

    return;

  }

  urls.forEach(item=>{

    const row=
      document.createElement("div");

    row.className="url-row";

    row.innerHTML=`

      <div class="url-info">

        <div class="url-title">
          ${escapeHTML(item.url)}
        </div>

        <div class="url-link">
          Saved URL
        </div>

      </div>

      <div class="url-actions">

        <button
          class="small-btn"
          onclick="openSavedURL(${item.id})"
        >
          Open
        </button>

        <button
          class="small-btn danger"
          onclick="deleteURL(${item.id})"
        >
          Delete
        </button>

      </div>

    `;

    box.appendChild(row);

  });

}

function openSavedURL(id){

  const item=
    getURLs().find(
      x=>x.id===id
    );

  if(!item)return;

  window.open(
    safeURL(item.url),
    "_blank",
    "noopener"
  );

}

function deleteURL(id){

  saveURLs(
    getURLs().filter(
      x=>x.id!==id
    )
  );

  renderURLs();

  toast("URL deleted");

}

function clearURLs(){

  if(!confirm(
    "Delete all saved URLs?"
  )) return;

  localStorage.removeItem(KEY_URLS);

  renderURLs();

  toast("All URLs cleared");

}

   SETTINGS
========================================================= */

function openSettings(){

  document.getElementById(
    "settingsOverlay"
  ).style.display="flex";

}

function openManageApps(){

  closeModal("settingsOverlay");

  renderManageApps();

  document.getElementById(

  ).style.display="flex";

}

function renderManageApps(){

  const box=
    document.getElementById(
      "manageList"
    );

  box.innerHTML="";

  apps.forEach((app,index)=>{

    const row=
      document.createElement("div");

    row.className="manage-row";

    row.innerHTML=`

      <div class="manage-logo">
        ${getLogoSVG(app)}
      </div>

      <div class="manage-name">
        ${escapeHTML(app.name)}
      </div>

      <button
        class="small-btn danger"
        onclick="removeManagedApp(${index})"
      >
        Remove
      </button>

    `;

    box.appendChild(row);

  });

}

function removeManagedApp(index){

  removeApp(index);

  renderManageApps();

}

function resetLoopin(){

  if(!confirm(
    "Reset LOOPIN to default apps?"
  )) return;

  localStorage.removeItem(KEY_APPS);
  localStorage.removeItem(KEY_NOTE);
  localStorage.removeItem(KEY_URLS);

  apps=
    DEFAULT_IDS
    .map(findLibraryApp)
    .filter(Boolean)
    .map(makeApp);

  fillNextApps();

  saveApps();
  renderApps();

  closeModal("settingsOverlay");

  toast("LOOPIN reset");

}


/* =========================================================
   MODALS
========================================================= */

function closeModal(id){

  const el=
    document.getElementById(id);

  if(el)
    el.style.display="none";

}

document
.querySelectorAll(".overlay")
.forEach(overlay=>{

  overlay.addEventListener(
    "click",
    function(e){

      if(e.target===overlay)
        overlay.style.display="none";

    }
  );

});

document.addEventListener(
  "keydown",
  function(e){

    if(e.key==="Escape"){

      document
      .querySelectorAll(".overlay")
      .forEach(x=>{
        x.style.display="none";
      });

      hideContextMenu();

    }

  }
);

document.addEventListener(
  "click",
  function(e){

    const menu=
      document.getElementById(
        "contextMenu"
      );

    if(
      menu.style.display==="block" &&
      !menu.contains(e.target)
    ){

      hideContextMenu();

    }

  }
);

/* =========================================================
   TOAST
========================================================= */

let toastTimer=null;

function toast(message){

  const el=
    document.getElementById("toast");

  el.textContent=message;

  el.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer=
    setTimeout(
      ()=>{
        el.classList.remove("show");
      },
      1800
    );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function escapeAttr(value){

  return escapeHTML(value);

}
