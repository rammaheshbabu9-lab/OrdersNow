<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>LOOPIN</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{
  font-family:Inter,Arial,Helvetica,sans-serif;
  background:#fff;color:#111;overflow:hidden
}
button,input,textarea{font-family:inherit}
.app{width:100%;height:100vh;display:flex;background:#fff}

/* SIDEBAR */
.sidebar{
 position:fixed;left:0;top:0;bottom:0;width:92px;background:#fff;
 border-right:1px solid #e8e8e8;display:flex;flex-direction:column;
 align-items:center;padding:16px 7px 10px;z-index:100;overflow:hidden
}
.brand{width:52px;height:52px;flex:none;cursor:pointer;margin-bottom:15px}
.brand svg{width:100%;height:100%;display:block}
.apps{
 width:100%;flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
 display:flex;flex-direction:column;align-items:center;gap:7px;padding:3px 0 8px
}
.apps::-webkit-scrollbar{display:none}
.app-item{
 width:68px;min-height:67px;border:0;background:#fff;border-radius:14px;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 cursor:pointer;position:relative;transition:.16s;flex:none
}
.app-item:hover{background:#f5f5f5}
.app-item:active{transform:scale(.96)}
.app-logo,.library-logo,.manage-logo{
 width:35px;height:35px;display:flex;align-items:center;justify-content:center;
 flex:none;margin-bottom:4px
}
.app-logo svg,.library-logo svg,.manage-logo svg{
 width:100%;height:100%;display:block
}
.app-name{
 width:65px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
 text-align:center;font-size:9px;color:#555;line-height:11px
}
.add-app{
 width:68px;min-height:54px;flex:none;border:1px dashed #cfcfcf;background:#fff;
 border-radius:14px;color:#333;cursor:pointer;display:flex;flex-direction:column;
 align-items:center;justify-content:center;margin:2px 0 8px
}
.add-app:hover{background:#f7f7f7}
.add-plus{font-size:22px;line-height:20px}
.add-text{font-size:9px;margin-top:3px}
.sidebar-bottom{
 width:100%;flex:none;display:flex;flex-direction:column;align-items:center;
 gap:6px;padding-bottom:4px;transform:translateY(-12px)
}
.side-action{
 width:68px;height:39px;border:0;background:#fff;border-radius:12px;color:#555;
 font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px
}
.side-action:hover{background:#f5f5f5;color:#111}
.side-action span{font-size:16px}

/* WORKSPACE */
.workspace{
 margin-left:92px;width:calc(100% - 92px);height:100vh;position:relative;background:#fff
}
.top-search{
 position:absolute;top:22px;left:50%;transform:translateX(-50%);
 width:min(700px,calc(100% - 50px));z-index:20
}
.top-search-inner{
 width:100%;height:54px;border:1px solid #dedede;border-radius:17px;background:#fff;
 display:flex;align-items:center;padding:0 7px 0 17px;
 box-shadow:0 5px 20px rgba(0,0,0,.045);transition:.2s
}
.top-search-inner:focus-within{
 border-color:#c8c8c8;box-shadow:0 8px 28px rgba(0,0,0,.07)
}
.search-icon{font-size:23px;color:#777;margin-right:10px;line-height:1}
.top-search-inner input{
 flex:1;width:100%;height:100%;border:0;outline:0;background:#fff;
 color:#111;font-size:14px
}
.top-search-inner input::placeholder{color:#999}
.top-search-inner button{
 width:40px;height:40px;border:1px solid #dedede;border-radius:12px;
 background:#fff;color:#111;font-size:21px;cursor:pointer;display:flex;
 align-items:center;justify-content:center
}
.top-search-inner button:hover{background:#f5f5f5}

/* MODALS */
.overlay{
 position:fixed;inset:0;background:rgba(0,0,0,.25);backdrop-filter:blur(5px);
 -webkit-backdrop-filter:blur(5px);display:none;align-items:center;
 justify-content:center;padding:18px;z-index:500
}
.modal{
 width:min(620px,100%);max-height:88vh;overflow:hidden;background:#fff;
 border:1px solid #e5e5e5;border-radius:22px;box-shadow:0 25px 80px rgba(0,0,0,.18)
}
.modal-head{
 height:64px;padding:0 18px 0 22px;border-bottom:1px solid #eee;
 display:flex;align-items:center;justify-content:space-between
}
.modal-title{font-size:17px;font-weight:700}
.close{
 width:35px;height:35px;border:0;border-radius:11px;background:#f5f5f5;
 color:#333;font-size:22px;cursor:pointer
}
.close:hover{background:#ebebeb}
.modal-body{
 padding:18px;max-height:calc(88vh - 64px);overflow:auto
}

/* ADD APP */
.library-search{
 width:100%;height:45px;border:1px solid #ddd;border-radius:13px;outline:0;
 padding:0 13px;font-size:13px;margin-bottom:13px
}
.library{
 display:grid;grid-template-columns:repeat(2,1fr);gap:8px;
 max-height:55vh;overflow:auto
}
.library-item{
 min-height:59px;border:1px solid #eee;background:#fff;border-radius:14px;
 display:flex;align-items:center;gap:10px;padding:8px 10px;cursor:pointer
}
.library-item:hover{background:#f7f7f7}
.library-logo{width:34px;height:34px;margin:0}
.library-name{font-size:12px;color:#222}

/* INPUTS */
.field{margin-bottom:13px}
.field label{display:block;font-size:11px;color:#666;margin-bottom:6px}
.field input,.field textarea{
 width:100%;border:1px solid #ddd;border-radius:12px;padding:11px 12px;
 outline:0;font-size:13px;color:#111;background:#fff
}
.field textarea{min-height:180px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:#aaa}
.primary{
 height:43px;width:100%;border:0;border-radius:12px;background:#111;
 color:#fff;font-size:13px;font-weight:600;cursor:pointer
}
.primary:hover{background:#2a2a2a}
.secondary{
 height:42px;border:1px solid #ddd;background:#fff;color:#222;border-radius:12px;
 padding:0 15px;cursor:pointer
}

/* SAVED ITEMS */
.saved-tools{display:flex;gap:8px;margin-bottom:12px}
.saved-tools input{
 flex:1;height:42px;border:1px solid #ddd;border-radius:12px;
 outline:0;padding:0 12px;font-size:12px
}
.saved-list{display:flex;flex-direction:column;gap:8px}
.saved-card{
 border:1px solid #eee;border-radius:14px;padding:11px;
 display:flex;align-items:center;justify-content:space-between;gap:10px
}
.saved-info{min-width:0;flex:1}
.saved-title{
 font-size:12px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis
}
.saved-preview{
 font-size:10px;color:#888;margin-top:4px;overflow:hidden;
 white-space:nowrap;text-overflow:ellipsis
}
.saved-date{font-size:9px;color:#aaa;margin-top:3px}
.saved-actions{display:flex;gap:5px;flex:none}
.small-btn{
 height:32px;padding:0 9px;border:1px solid #ddd;background:#fff;
 border-radius:9px;font-size:10px;cursor:pointer
}
.small-btn:hover{background:#f5f5f5}
.danger{color:#c62828}

/* SETTINGS */
.setting-list{display:flex;flex-direction:column;gap:8px}
.setting-btn{
 width:100%;min-height:50px;border:1px solid #eee;background:#fff;
 border-radius:13px;text-align:left;padding:0 14px;cursor:pointer;font-size:12px
}
.setting-btn:hover{background:#f7f7f7}
.manage-list{display:flex;flex-direction:column;gap:8px}
.manage-row{
 min-height:55px;border:1px solid #eee;border-radius:13px;
 display:flex;align-items:center;gap:10px;padding:8px
}
.manage-logo{width:34px;height:34px;margin:0}
.manage-name{flex:1;font-size:12px}

/* CONTEXT */
.context-menu{
 position:fixed;display:none;width:165px;background:#fff;border:1px solid #e5e5e5;
 border-radius:13px;box-shadow:0 15px 45px rgba(0,0,0,.15);padding:5px;z-index:1000
}
.context-menu button{
 width:100%;height:38px;border:0;background:#fff;border-radius:9px;
 text-align:left;padding:0 10px;font-size:11px;cursor:pointer
}
.context-menu button:hover{background:#f5f5f5}

/* TOAST */
.toast{
 position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
 background:#111;color:#fff;border-radius:12px;padding:10px 15px;font-size:11px;
 opacity:0;pointer-events:none;transition:.22s;z-index:2000
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:600px){
 .sidebar{width:78px;padding:12px 5px 8px}
 .brand{width:47px;height:47px;margin-bottom:10px}
 .app-item,.add-app,.side-action{width:62px}
 .app-item{min-height:62px}
 .app-logo{width:32px;height:32px}
 .app-name{width:58px;font-size:8px}
 .sidebar-bottom{transform:translateY(-8px);gap:4px}
 .side-action{height:35px;font-size:8px}
 .side-action span{font-size:14px}
 .workspace{margin-left:78px;width:calc(100% - 78px)}
 .top-search{top:14px;width:calc(100% - 25px)}
 .top-search-inner{height:48px;border-radius:15px;padding-left:13px}
 .top-search-inner input{font-size:12px}
 .top-search-inner button{width:36px;height:36px;border-radius:10px}
 .library{grid-template-columns:1fr}
 .modal{border-radius:18px}
 .saved-card{align-items:flex-start;flex-direction:column}
 .saved-actions{width:100%}
 .saved-actions button{flex:1}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

<div class="brand" title="LOOPIN">
<svg viewBox="0 0 52 52">
<defs>
<linearGradient id="loopinGradient" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111"/>
<stop offset="1" stop-color="#3b3b3b"/>
</linearGradient>
</defs>
<rect x="2" y="2" width="48" height="48" rx="15" fill="url(#loopinGradient)"/>
<path d="M17 14V30.5C17 36.2 20.2 40 25.3 40C30.6 40 35 36.2 35 30.3V19C35 16.1 33.1 14 30.7 14C28.2 14 26.4 16.1 26.4 19V29.8C26.4 31.5 25.9 32.2 24.9 32.2C23.8 32.2 23.3 31.5 23.3 29.8V14" fill="none" stroke="#fff" stroke-width="3.7" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="36" cy="36" r="2.3" fill="#fff"/>
</svg>
</div>

<div class="apps" id="apps"></div>

<button class="add-app" onclick="openAddApp()">
<div class="add-plus">+</div>
<div class="add-text">Add App</div>
</button>

<div class="sidebar-bottom">
<button class="side-action" onclick="openNotes()"><span>✎</span><b>Notes</b></button>
<button class="side-action" onclick="openURLs()"><span>🔗</span><b>Saved</b></button>
<button class="side-action" onclick="openSettings()"><span>⚙</span><b>Settings</b></button>
</div>

</aside>

<main class="workspace">
<div class="top-search">
<div class="top-search-inner">
<span class="search-icon">⌕</span>
<input id="globalSearch" type="text" placeholder="Search movies, news, apps, anything..." autocomplete="off">
<button onclick="doGoogleSearch()" title="Search">→</button>
</div>
</div>
</main>

</div>

<!-- ADD APP -->
<div class="overlay" id="addOverlay">
<div class="modal">
<div class="modal-head">
<div class="modal-title">Add App</div>
<button class="close" onclick="closeModal('addOverlay')">×</button>
</div>
<div class="modal-body">

<input id="librarySearch" class="library-search" placeholder="Search apps..." autocomplete="off">

<div id="library" class="library"></div>

<div style="height:15px"></div>

<div class="field">
<label>Custom App Name</label>
<input id="customName" placeholder="Example: My Website">
</div>

<div class="field">
<label>Custom App URL</label>
<input id="customURL" placeholder="https://example.com">
</div>

<button class="primary" onclick="addCustomApp()">Add Custom App</button>

</div>
</div>
</div>

<!-- NOTES -->
<div class="overlay" id="notesOverlay">
<div class="modal">
<div class="modal-head">
<div class="modal-title">Notepad</div>
<button class="close" onclick="closeModal('notesOverlay')">×</button>
</div>
<div class="modal-body">

<div id="notesListView">

<div style="display:flex;justify-content:flex-end;margin-bottom:12px">
<button class="primary" style="width:auto;padding:0 15px" onclick="newNote()">+ New Note</button>
</div>

<div id="notesList" class="saved-list"></div>

</div>

<div id="noteEditor" style="display:none">

<div class="field">
<label>Note Name</label>
<input id="noteName" placeholder="Example: Project Ideas">
</div>

<div class="field">
<label>Note</label>
<textarea id="noteText" placeholder="Write your notes here..."></textarea>
</div>

<div style="display:flex;gap:8px">
<button class="primary" onclick="saveNote()">Save Note</button>
<button class="secondary" onclick="showNotesList()">Cancel</button>
</div>

</div>

</div>
</div>
</div>

<!-- URLS -->
<div class="overlay" id="urlsOverlay">
<div class="modal">
<div class="modal-head">
<div class="modal-title">Saved URLs</div>
<button class="close" onclick="closeModal('urlsOverlay')">×</button>
</div>
<div class="modal-body">

<div class="saved-tools">
<input id="urlInput" placeholder="Paste URL...">
<button class="primary" style="width:auto;padding:0 14px" onclick="saveURL()">Save</button>
</div>

<div id="urlList" class="saved-list"></div>

<div style="margin-top:12px">
<button class="secondary" onclick="clearURLs()">Clear All</button>
</div>

</div>
</div>
</div>

<!-- SETTINGS -->
<div class="overlay" id="settingsOverlay">
<div class="modal">
<div class="modal-head">
<div class="modal-title">Settings</div>
<button class="close" onclick="closeModal('settingsOverlay')">×</button>
</div>
<div class="modal-body">
<div class="setting-list">

<button class="setting-btn" onclick="openManageApps()">
<b>Manage Apps</b><br>
<span style="color:#888">Remove apps from LOOPIN</span>
</button>

<button class="setting-btn" onclick="resetLoopin()">
<b>Reset LOOPIN</b><br>
<span style="color:#888">Restore default apps and clear local data</span>
</button>

</div>
</div>
</div>
</div>

<!-- MANAGE -->
<div class="overlay" id="manageOverlay">
<div class="modal">
<div class="modal-head">
<div class="modal-title">Manage Apps</div>
<button class="close" onclick="closeModal('manageOverlay')">×</button>
</div>
<div class="modal-body">
<div id="manageList" class="manage-list"></div>
</div>
</div>
</div>

<div class="context-menu" id="contextMenu">
<button onclick="contextOpen()">Open App</button>
<button onclick="contextRemove()">Remove App</button>
</div>

<div class="toast" id="toast"></div>

const APP_LIBRARY=[...BASE_APPS];

for(let i=1;i<=1000;i++){
 const keyword=DAILY_SEARCHES[(i-1)%DAILY_SEARCHES.length];
 APP_LIBRARY.push([
   "search_"+i,
   keyword+" "+i,
   "https://www.google.com/search?q="+encodeURIComponent(keyword)
 ]);
}

/* ================= STATE ================= */

let apps=[];
let contextIndex=-1;
let contextTimer=null;
let editingNoteId=null;

/* ================= HELPERS ================= */

function makeApp(row){
 return {id:row[0],name:row[1],url:row[2]};
}

function findLibraryApp(id){
 return APP_LIBRARY.find(x=>x[0]===id);
}

function safeURL(url){
 if(!url)return "#";
 return /^https?:\/\//i.test(url)?url:"https://"+url;
}

function escapeHTML(value){
 return String(value??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

function escapeAttr(value){return escapeHTML(value)}

function fallbackSVG(name){
 return LOGOS.search;
}

function getLogoSVG(app){
 return LOGOS[app.id]||fallbackSVG(app.name);
}

function appLogoHTML(app){
 return `<div class="app-logo" title="${escapeAttr(app.name)}">${getLogoSVG(app)}</div>`;
}

/* ================= APPS ================= */

function loadApps(){

 try{
   const raw=localStorage.getItem(KEY_APPS);
   if(raw){
     const parsed=JSON.parse(raw);
     if(Array.isArray(parsed)){
       apps=parsed.filter(x=>x&&x.id&&x.name&&x.url)
                  .slice(0,MAX_VISIBLE_APPS);
     }
   }
 }catch(e){apps=[]}

 if(!apps.length){
   apps=DEFAULT_IDS.map(findLibraryApp).filter(Boolean).map(makeApp);
 }

 fillNextApps();
 saveApps();
}

function saveApps(){
 localStorage.setItem(KEY_APPS,JSON.stringify(apps));
}

function fillNextApps(){

 const used=new Set(apps.map(a=>a.id));

 for(const row of APP_LIBRARY){
   if(apps.length>=MAX_VISIBLE_APPS)break;

   if(!used.has(row[0])){
     apps.push(makeApp(row));
     used.add(row[0]);
   }
 }
}

function renderApps(){

 const box=document.getElementById("apps");
 box.innerHTML="";

 apps.forEach((app,index)=>{

   const button=document.createElement("button");
   button.className="app-item";
   button.title=app.name;

   button.innerHTML=
     appLogoHTML(app)+
     `<div class="app-name">${escapeHTML(app.name)}</div>`;

   button.onclick=()=>openApp(index);

   button.addEventListener("contextmenu",e=>{
     e.preventDefault();
     showContextMenu(e.clientX,e.clientY,index);
   });

   button.addEventListener("touchstart",()=>{
     contextTimer=setTimeout(()=>{
       showContextMenu(window.innerWidth/2,window.innerHeight/2,index);
     },650);
   },{passive:true});

   button.addEventListener("touchend",clearContextTimer);
   button.addEventListener("touchmove",clearContextTimer);

   box.appendChild(button);
 });
}

function openApp(index){

 if(index<0||index>=apps.length)return;

 window.open(
   safeURL(apps[index].url),
   "_blank",
   "noopener"
 );
}

/* ================= ADD APP ================= */

function openAddApp(){

 document.getElementById("addOverlay").style.display="flex";
 document.getElementById("librarySearch").value="";
 renderLibrary();
}

function renderLibrary(){

 const query=document.getElementById("librarySearch")
   .value.trim().toLowerCase();

 const box=document.getElementById("library");

 const used=new Set(apps.map(a=>a.id));

 const rows=APP_LIBRARY
   .filter(row=>{
     if(used.has(row[0]))return false;
     if(!query)return true;
     return row[1].toLowerCase().includes(query);
   })
   .slice(0,150);

 box.innerHTML="";

 if(!rows.length){
   box.innerHTML=`
   <div style="grid-column:1/-1;text-align:center;padding:25px;color:#888;font-size:12px">
   No apps found
   </div>`;
   return;
 }

 rows.forEach(row=>{

   const item=document.createElement("div");
   item.className="library-item";

   const temp=makeApp(row);

   item.innerHTML=`
   <div class="library-logo">${getLogoSVG(temp)}</div>
   <div class="library-name">${escapeHTML(row[1])}</div>
   `;

   item.onclick=()=>addLibraryApp(row[0]);

   box.appendChild(item);
 });
}

function addLibraryApp(id){

 const row=findLibraryApp(id);
 if(!row)return;

 const newApp=makeApp(row);

 apps=apps.filter(a=>a.id!==id);

 if(apps.length>=MAX_VISIBLE_APPS)apps.pop();

 apps.push(newApp);

 fillNextApps();
 saveApps();
 renderApps();

 closeModal("addOverlay");
 toast(row[1]+" added");
}

function addCustomApp(){

 const name=document.getElementById("customName").value.trim();
 let url=document.getElementById("customURL").value.trim();

 if(!name){toast("Enter app name");return}
 if(!url){toast("Enter app URL");return}

 url=safeURL(url);

 if(apps.length>=MAX_VISIBLE_APPS)apps.pop();

 apps.push({
   id:"custom_"+Date.now(),
   name,
   url
 });

 saveApps();
 renderApps();

 document.getElementById("customName").value="";
 document.getElementById("customURL").value="";

 closeModal("addOverlay");
 toast(name+" added");
}

/* ================= REMOVE ================= */

function removeApp(index){

 if(index<0||index>=apps.length)return;

 const name=apps[index].name;

 apps.splice(index,1);
 fillNextApps();
 saveApps();
 renderApps();

 toast(name+" removed");
}

/* ================= CONTEXT ================= */

function showContextMenu(x,y,index){

 contextIndex=index;

 const menu=document.getElementById("contextMenu");
 menu.style.display="block";

 const maxX=window.innerWidth-menu.offsetWidth-8;
 const maxY=window.innerHeight-menu.offsetHeight-8;

 menu.style.left=Math.min(x,maxX)+"px";
 menu.style.top=Math.min(y,maxY)+"px";
}

function hideContextMenu(){
 document.getElementById("contextMenu").style.display="none";
 contextIndex=-1;
}

function contextOpen(){
 if(contextIndex>=0)openApp(contextIndex);
 hideContextMenu();
}

function contextRemove(){
 if(contextIndex>=0)removeApp(contextIndex);
 hideContextMenu();
}

function clearContextTimer(){
 if(contextTimer){
   clearTimeout(contextTimer);
   contextTimer=null;
 }
}

/* ================= SEARCH ================= */

function doGoogleSearch(){

 const input=document.getElementById("globalSearch");
 const query=input.value.trim();

 if(!query){
   input.focus();
   return;
 }

 window.open(
   "https://www.google.com/search?q="+encodeURIComponent(query),
   "_blank",
   "noopener"
 );

 input.value="";
}

document.getElementById("globalSearch").addEventListener("keydown",e=>{
 if(e.key==="Enter"){
   e.preventDefault();
   doGoogleSearch();
 }
});

   const data=JSON.parse(localStorage.getItem(KEY_NOTES)||"[]");
   return Array.isArray(data)?data:[];

   return [];
 }
}

function newNote(){

 document.getElementById("noteText").value="";

 document.getElementById("notesListView").style.display="none";
 document.getElementById("noteEditor").style.display="block";

 setTimeout(()=>document.getElementById("noteName").focus(),100);
}

function editNote(id){

 const note=getNotes().find(x=>x.id===id);
 if(!note)return;

 editingNoteId=id;

 document.getElementById("noteName").value=note.name;
 document.getElementById("noteText").value=note.text;

 document.getElementById("notesListView").style.display="none";
 document.getElementById("noteEditor").style.display="block";
}

function saveNote(){

 const name=document.getElementById("noteName").value.trim();
 const text=document.getElementById("noteText").value;

 if(!name){
   toast("Enter note name");
   return;
 }

 if(!text.trim()){
   toast("Write something");
   return;
 }

 const notes=getNotes();

 if(editingNoteId){

   const index=notes.findIndex(x=>x.id===editingNoteId);

   if(index>=0){
     notes[index].name=name;
     notes[index].text=text;
     notes[index].updated=Date.now();
   }

   toast("Note updated");

 }else{

   notes.unshift({
     id:Date.now(),
     name:name,
     text:text,
     created:Date.now(),
     updated:Date.now()
   });

   toast("Note saved");
 }

 saveNotes(notes);
 showNotesList();
}

function deleteNote(id){

 if(!confirm("Delete this note?"))return;

 saveNotes(getNotes().filter(x=>x.id!==id));

 renderNotes();

 toast("Note deleted");
}

function renderNotes(){

 const box=document.getElementById("notesList");
 const notes=getNotes();

 box.innerHTML="";

 if(!notes.length){

   box.innerHTML=`
   <div style="padding:30px 10px;text-align:center;color:#999;font-size:12px">
   No saved notes<br><br>
   Tap <b>+ New Note</b> to create one
   </div>`;

   return;
 }

 notes.forEach(note=>{

   const card=document.createElement("div");
   card.className="saved-card";

   const date=new Date(note.updated||note.created);

   card.innerHTML=`
   <div class="saved-info">
     <div class="saved-title">${escapeHTML(note.name)}</div>
     <div class="saved-preview">${escapeHTML(note.text)}</div>
     <div class="saved-date">${date.toLocaleString()}</div>
   </div>

   <div class="saved-actions">
     <button class="small-btn" onclick="editNote(${note.id})">
       Open / Edit
     </button>

     <button class="small-btn danger" onclick="deleteNote(${note.id})">
       Delete
     </button>
   </div>
   `;

   box.appendChild(card);
 });
}

/* ================= SAVED URLS ================= */

function getURLs(){

 try{
   const data=JSON.parse(localStorage.getItem(KEY_URLS)||"[]");
   return Array.isArray(data)?data:[];
 }catch(e){
   return [];
 }
}

function saveURLs(data){
 localStorage.setItem(KEY_URLS,JSON.stringify(data));
}

function openURLs(){

 renderURLs();

 document.getElementById("urlsOverlay").style.display="flex";
}

function saveURL(){

 let url=document.getElementById("urlInput").value.trim();

 if(!url){
   toast("Enter URL");
   return;
 }

 url=safeURL(url);

 const urls=getURLs();

 urls.unshift({
   id:Date.now(),
   name:url.replace(/^https?:\/\//,"").split("/")[0],
   url:url,
   created:Date.now()
 });

 saveURLs(urls);

 document.getElementById("urlInput").value="";

 renderURLs();

 toast("URL saved");
}

function renderURLs(){

 const box=document.getElementById("urlList");
 const urls=getURLs();

 box.innerHTML="";

 if(!urls.length){

   box.innerHTML=`
   <div style="padding:30px 10px;text-align:center;color:#999;font-size:12px">
   No saved URLs
   </div>`;

   return;
 }

 urls.forEach(item=>{

   const row=document.createElement("div");
   row.className="saved-card";

   const date=new Date(item.created);

   row.innerHTML=`
   <div class="saved-info">
     <div class="saved-title">${escapeHTML(item.name)}</div>
     <div class="saved-preview">${escapeHTML(item.url)}</div>
     <div class="saved-date">${date.toLocaleString()}</div>
   </div>

   <div class="saved-actions">
     <button class="small-btn" onclick="openSavedURL(${item.id})">
       Open
     </button>

     <button class="small-btn danger" onclick="deleteURL(${item.id})">
       Delete
     </button>
   </div>
   `;

   box.appendChild(row);
 });
}

function openSavedURL(id){

 const item=getURLs().find(x=>x.id===id);

 if(!item)return;

 window.open(
   safeURL(item.url),
   "_blank",
   "noopener"
 );
}

function deleteURL(id){

 saveURLs(getURLs().filter(x=>x.id!==id));

 renderURLs();

 toast("URL deleted");
}

function clearURLs(){

 if(!confirm("Delete all saved URLs?"))return;

 localStorage.removeItem(KEY_URLS);

 renderURLs();

 toast("All URLs cleared");
}

/* ================= SETTINGS ================= */

function openSettings(){
 document.getElementById("settingsOverlay").style.display="flex";
}

function openManageApps(){

 closeModal("settingsOverlay");

 renderManageApps();

 document.getElementById("manageOverlay").style.display="flex";
}

function renderManageApps(){

 const box=document.getElementById("manageList");

 box.innerHTML="";

 apps.forEach((app,index)=>{

   const row=document.createElement("div");
   row.className="manage-row";

   row.innerHTML=`
   <div class="manage-logo">${getLogoSVG(app)}</div>
   <div class="manage-name">${escapeHTML(app.name)}</div>
   <button class="small-btn danger" onclick="removeManagedApp(${index})">
   Remove
   </button>
   `;

   box.appendChild(row);
 });
}

function removeManagedApp(index){

 removeApp(index);

 renderManageApps();
}

function resetLoopin(){

 if(!confirm("Reset LOOPIN to default apps and clear saved data?"))return;

 localStorage.removeItem(KEY_APPS);
 localStorage.removeItem(KEY_NOTES);
 localStorage.removeItem(KEY_URLS);

 apps=DEFAULT_IDS
   .map(findLibraryApp)
   .filter(Boolean)
   .map(makeApp);

 fillNextApps();
 saveApps();
 renderApps();
 renderNotes();
 renderURLs();

 closeModal("settingsOverlay");

 toast("LOOPIN reset");
}

/* ================= MODALS ================= */

function closeModal(id){

 const el=document.getElementById(id);

 if(el)el.style.display="none";
}

document.querySelectorAll(".overlay").forEach(overlay=>{

 overlay.addEventListener("click",e=>{
   if(e.target===overlay)overlay.style.display="none";
 });

});

document.addEventListener("keydown",e=>{

 if(e.key==="Escape"){

   document.querySelectorAll(".overlay").forEach(x=>{
     x.style.display="none";
   });

   hideContextMenu();
 }
});

document.addEventListener("click",e=>{

 const menu=document.getElementById("contextMenu");

 if(menu.style.display==="block"&&!menu.contains(e.target)){
   hideContextMenu();
 }
});

/* ================= LIBRARY SEARCH ================= */

document.getElementById("librarySearch")
.addEventListener("input",renderLibrary);

/* ================= URL ENTER ================= */

document.getElementById("urlInput").addEventListener("keydown",e=>{
 if(e.key==="Enter"){
   e.preventDefault();
   saveURL();
 }
});

/* ================= TOAST ================= */

let toastTimer=null;

function toast(message){

 const el=document.getElementById("toast");

 el.textContent=message;
 el.classList.add("show");

 clearTimeout(toastTimer);

 toastTimer=setTimeout(()=>{
   el.classList.remove("show");
 },1800);
}

/* ================= START ================= */

loadApps();
renderApps();

</script>
