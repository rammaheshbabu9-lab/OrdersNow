<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>LOOPIN</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:#fff;
  color:#111;
  overflow:hidden;
}

/* =========================
   APP SHELL
========================= */

.app-shell{
  width:100%;
  height:100vh;
  display:flex;
  background:#fff;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  width:76px;
  min-width:76px;
  height:100vh;
  border-right:1px solid #e9e9ed;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:14px 10px;
  z-index:50;
}

.logo{
  width:42px;
  height:42px;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:14px;
  cursor:pointer;
}

.logo svg{
  width:42px;
  height:42px;
}

/* top tools */

.top-tools{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
}

.tool-btn{
  width:48px;
  height:44px;
  border:0;
  background:transparent;
  border-radius:13px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  color:#777;
  transition:.16s ease;
}

.tool-btn:hover{
  background:#f5f5f7;
  color:#111;
}

.tool-btn.active{
  background:#f1f1f4;
  color:#111;
}

.tool-icon{
  width:19px;
  height:19px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.tool-label{
  font-size:8px;
  margin-top:2px;
  font-weight:600;
}

/* divider */

.divider{
  width:34px;
  height:1px;
  background:#ededf0;
  margin:9px 0;
}

/* apps */

.apps-list{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
  overflow-y:auto;
  overflow-x:visible;
  padding:2px 0 5px;
  scrollbar-width:none;
}

.apps-list::-webkit-scrollbar{
  display:none;
}

.app-item{
  width:48px;
  height:48px;
  border-radius:14px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  user-select:none;
  transition:.16s ease;
}

.app-item:hover{
  background:#f5f5f7;
  transform:translateY(-1px);
}

.app-item.dragging{
  opacity:.4;
  transform:scale(.94);
}

.app-item.drag-over{
  background:#eeeef2;
  outline:2px dashed #c8c8cf;
}

.app-icon{
  width:30px;
  height:30px;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:800;
  overflow:hidden;
}

.app-icon svg{
  width:30px;
  height:30px;
}

.app-letter{
  color:#fff;
  width:30px;
  height:30px;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:12px;
}

/* tooltip */

.app-item::after{
  content:attr(data-name);
  position:absolute;
  left:58px;
  top:50%;
  transform:translateY(-50%);
  background:#151515;
  color:#fff;
  font-size:11px;
  padding:7px 9px;
  border-radius:8px;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transition:.12s ease;
  z-index:100;
}

.app-item:hover::after{
  opacity:1;
}

/* bottom */

.bottom-tools{
  margin-top:auto;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
}

/* =========================
   MAIN
========================= */

.main{
  flex:1;
  min-width:0;
  height:100vh;
  position:relative;
  background:#fff;
}

.topbar{
  height:62px;
  width:100%;
  border-bottom:1px solid #f0f0f2;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  padding:0 20px;
}

.search-btn{
  width:40px;
  height:40px;
  border:0;
  border-radius:12px;
  background:#fff;
  color:#666;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.search-btn:hover{
  background:#f5f5f7;
  color:#111;
}

.workspace{
  height:calc(100vh - 62px);
  overflow:auto;
  position:relative;
}

/* home */

.home{
  min-height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
}

.home-message{
  color:#a0a0a7;
  font-size:15px;
  font-weight:500;
  text-align:center;
}

/* =========================
   PAGE
========================= */

.page{
  min-height:100%;
  padding:42px 5vw;
  max-width:1100px;
  margin:auto;
}

.page-header{
  margin-bottom:28px;
}

.page-title{
  font-size:30px;
  letter-spacing:-.8px;
  font-weight:700;
}

.page-subtitle{
  margin-top:7px;
  color:#8b8b92;
  font-size:14px;
}

/* =========================
   NOTES
========================= */

.notes-box{
  width:100%;
  min-height:520px;
  border:1px solid #e7e7eb;
  border-radius:18px;
  padding:22px;
  resize:none;
  outline:none;
  font-family:inherit;
  font-size:15px;
  line-height:1.7;
  color:#222;
  background:#fff;
  box-shadow:0 8px 30px rgba(0,0,0,.03);
}

.notes-box:focus{
  border-color:#cfcfd6;
}

/* =========================
   SAVED URLS
========================= */

.url-add{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.url-add input{
  flex:1;
  height:44px;
  border:1px solid #e6e6ea;
  border-radius:11px;
  padding:0 13px;
  outline:none;
  font-size:13px;
}

.url-add input:focus{
  border-color:#bdbdc5;
}

.primary-btn{
  height:44px;
  border:0;
  background:#111;
  color:#fff;
  padding:0 18px;
  border-radius:11px;
  font-weight:600;
  cursor:pointer;
}

.primary-btn:hover{
  opacity:.88;
}

.saved-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.saved-card{
  border:1px solid #e9e9ed;
  border-radius:14px;
  padding:15px;
  display:flex;
  align-items:center;
  gap:12px;
}

.saved-info{
  flex:1;
  min-width:0;
}

.saved-title{
  font-size:14px;
  font-weight:650;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.saved-url{
  color:#999;
  font-size:11px;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.small-btn{
  height:34px;
  border:1px solid #e5e5e9;
  background:#fff;
  border-radius:9px;
  padding:0 11px;
  font-size:11px;
  cursor:pointer;
}

.small-btn:hover{
  background:#f6f6f8;
}

.danger{
  color:#c62828;
}

/* =========================
   SETTINGS
========================= */

.settings-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.setting-card{
  border:1px solid #e8e8ec;
  border-radius:16px;
  padding:19px;
  background:#fff;
}

.setting-title{
  font-size:14px;
  font-weight:700;
}

.setting-text{
  color:#999;
  font-size:12px;
  line-height:1.5;
  margin-top:6px;
}

.setting-action{
  margin-top:15px;
  height:36px;
  border:1px solid #e2e2e6;
  background:#fff;
  border-radius:9px;
  padding:0 12px;
  cursor:pointer;
  font-size:12px;
  font-weight:600;
}

.setting-action:hover{
  background:#f5f5f7;
}

.manage-apps{
  margin-top:25px;
}

.manage-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid #f0f0f2;
}

.manage-row:last-child{
  border-bottom:0;
}

.manage-icon{
  width:34px;
  height:34px;
  border-radius:9px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.manage-name{
  flex:1;
  font-size:13px;
  font-weight:600;
}

/* =========================
   MODALS
========================= */

.modal-layer{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.28);
  backdrop-filter:blur(7px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:200;
  padding:18px;
}

.modal-layer.show{
  display:flex;
}

.modal{
  width:min(620px,100%);
  max-height:88vh;
  overflow:auto;
  background:#fff;
  border-radius:22px;
  box-shadow:0 25px 80px rgba(0,0,0,.18);
  padding:22px;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:17px;
}

.modal-title{
  font-size:19px;
  font-weight:750;
}

.close-btn{
  width:34px;
  height:34px;
  border:0;
  border-radius:9px;
  background:#f5f5f7;
  cursor:pointer;
  font-size:17px;
}

.modal-label{
  display:block;
  font-size:11px;
  font-weight:700;
  color:#666;
  margin:14px 0 7px;
}

.input{
  width:100%;
  height:43px;
  border:1px solid #e5e5e9;
  border-radius:10px;
  padding:0 12px;
  outline:none;
  font-size:13px;
}

.input:focus{
  border-color:#bdbdc5;
}

/* app choices */

.app-search{
  margin-bottom:12px;
}

.app-choices{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
  max-height:310px;
  overflow:auto;
}

.app-choice{
  border:1px solid #e7e7eb;
  background:#fff;
  border-radius:13px;
  padding:10px;
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
  text-align:left;
}

.app-choice:hover{
  background:#f7f7f8;
  border-color:#d5d5da;
}

.choice-icon{
  width:34px;
  height:34px;
  border-radius:10px;
  overflow:hidden;
  flex:none;
}

.choice-info{
  min-width:0;
  flex:1;
}

.choice-name{
  font-size:12px;
  font-weight:700;
}

.choice-desc{
  color:#999;
  font-size:10px;
  margin-top:2px;
}

.add-choice{
  margin-top:12px;
  width:100%;
  border:1px dashed #d6d6db;
  background:#fafafa;
  border-radius:13px;
  padding:12px;
  cursor:pointer;
  font-size:12px;
  font-weight:650;
}

.custom-form{
  display:none;
}

.custom-form.show{
  display:block;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:9px;
  margin-top:18px;
}

.secondary-btn{
  height:40px;
  border:1px solid #e4e4e8;
  background:#fff;
  padding:0 14px;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
  font-size:12px;
}

/* context */

.context-menu{
  position:fixed;
  z-index:400;
  display:none;
  width:160px;
  background:#fff;
  border:1px solid #e5e5e8;
  border-radius:12px;
  box-shadow:0 15px 40px rgba(0,0,0,.15);
  padding:5px;
}

.context-menu.show{
  display:block;
}

.context-item{
  width:100%;
  height:36px;
  border:0;
  background:#fff;
  border-radius:8px;
  text-align:left;
  padding:0 10px;
  cursor:pointer;
  font-size:12px;
}

.context-item:hover{
  background:#f5f5f7;
}

.context-item.remove{
  color:#c62828;
}

/* =========================
   SEARCH
========================= */

.search-panel{
  position:absolute;
  top:68px;
  right:20px;
  width:min(410px,calc(100vw - 110px));
  background:#fff;
  border:1px solid #e6e6e9;
  border-radius:16px;
  box-shadow:0 18px 55px rgba(0,0,0,.13);
  padding:12px;
  display:none;
  z-index:100;
}

.search-panel.show{
  display:block;
}

.search-input-wrap{
  display:flex;
  align-items:center;
  gap:8px;
}

.search-input{
  flex:1;
  border:0;
  outline:none;
  height:40px;
  font-size:14px;
}

.search-hint{
  font-size:10px;
  color:#999;
  padding:6px 3px 1px;
}

/* =========================
   EMPTY
========================= */

.empty{
  padding:45px 20px;
  text-align:center;
  color:#aaa;
  font-size:13px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .sidebar{
    width:64px;
    min-width:64px;
    padding:10px 7px;
  }

  .logo,
  .logo svg{
    width:38px;
    height:38px;
  }

  .tool-btn{
    width:44px;
    height:42px;
  }

  .app-item{
    width:44px;
    height:44px;
  }

  .app-icon,
  .app-icon svg,
  .app-letter{
    width:28px;
    height:28px;
  }

  .app-item::after{
    display:none;
  }

  .topbar{
    height:56px;
    padding:0 12px;
  }

  .workspace{
    height:calc(100vh - 56px);
  }

  .page{
    padding:28px 18px;
  }

  .page-title{
    font-size:25px;
  }

  .settings-grid{
    grid-template-columns:1fr;
  }

  .app-choices{
    grid-template-columns:1fr;
  }

  .url-add{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<div class="app-shell">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <!-- LOOPIN LOGO -->
    <div class="logo" onclick="goHome()" title="LOOPIN">
      <svg viewBox="0 0 42 42" fill="none">
        <rect width="42" height="42" rx="13" fill="#111"/>
        <ellipse cx="21" cy="21" rx="13" ry="7.5"
                 stroke="white" stroke-width="2.2"
                 transform="rotate(-35 21 21)"/>
        <circle cx="29.5" cy="14" r="3.2" fill="#9B7CFF"/>
      </svg>
    </div>

    <!-- TOP TOOLS -->
    <div class="top-tools">

      <!-- SETTINGS MOVED TO TOP -->
      <button class="tool-btn" onclick="openPage('settings')" title="Settings">
        <span class="tool-icon">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
            <path d="M12 15.2A3.2 3.2 0 1 0 12 8.8a3.2 3.2 0 0 0 0 6.4Z"
                  stroke="currentColor" stroke-width="1.7"/>
            <path d="M19.4 15a1.8 1.8 0 0 0 .36 1.98l.06.06-1.7 1.7-.06-.06a1.8 1.8 0 0 0-1.98-.36 1.8 1.8 0 0 0-1.1 1.65v.09h-2.4v-.09a1.8 1.8 0 0 0-1.1-1.65 1.8 1.8 0 0 0-1.98.36l-.06.06-1.7-1.7.06-.06A1.8 1.8 0 0 0 8.2 15a1.8 1.8 0 0 0-1.65-1.1h-.09v-2.4h.09A1.8 1.8 0 0 0 8.2 10a1.8 1.8 0 0 0-.36-1.98l-.06-.06 1.7-1.7.06.06a1.8 1.8 0 0 0 1.98.36A1.8 1.8 0 0 0 12.62 5v-.09h2.4V5a1.8 1.8 0 0 0 1.1 1.65 1.8 1.8 0 0 0 1.98-.36l.06-.06 1.7 1.7-.06.06A1.8 1.8 0 0 0 19.44 10a1.8 1.8 0 0 0 1.65 1.1h.09v2.4h-.09A1.8 1.8 0 0 0 19.4 15Z"
                  stroke="currentColor" stroke-width="1.25"/>
          </svg>
        </span>
        <span class="tool-label">Settings</span>
      </button>

      <!-- ADD APP -->
      <button class="tool-btn" onclick="openAddApp()" title="Add App">
        <span class="tool-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M12 5v14M5 12h14" stroke="currentColor"
                  stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="tool-label">Add</span>
      </button>

    </div>

    <div class="divider"></div>

    <!-- APP LIST -->
    <div class="apps-list" id="appsList"></div>

    <!-- BOTTOM -->
    <div class="bottom-tools">

      <div class="divider"></div>

      <button class="tool-btn" onclick="openPage('notes')" title="Notes">
        <span class="tool-icon">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
            <path d="M5 4.8A1.8 1.8 0 0 1 6.8 3h10.4A1.8 1.8 0 0 1 19 4.8v14.4a1.8 1.8 0 0 1-1.8 1.8H6.8A1.8 1.8 0 0 1 5 19.2V4.8Z"
                  stroke="currentColor" stroke-width="1.6"/>
            <path d="M8.5 8h7M8.5 12h7M8.5 16h4.5"
                  stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round"/>
          </svg>
        </span>
        <span class="tool-label">Notes</span>
      </button>

      <button class="tool-btn" onclick="openPage('saved')" title="Saved URLs">
        <span class="tool-icon">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
            <path d="M6 5.5A2.5 2.5 0 0 1 8.5 3h7A2.5 2.5 0 0 1 18 5.5v15l-6-3.4-6 3.4v-15Z"
                  stroke="currentColor" stroke-width="1.6"
                  stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="tool-label">Saved</span>
      </button>

    </div>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <header class="topbar">
      <button class="search-btn" onclick="toggleSearch()" title="Search Google">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
          <circle cx="10.8" cy="10.8" r="6.3"
                  stroke="currentColor" stroke-width="1.8"/>
          <path d="m16 16 4.2 4.2"
                stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <div class="workspace" id="workspace">

      <!-- HOME -->
      <section class="home" id="homePage">
        <div class="home-message">
          Select an app from the left to get started.
        </div>
      </section>

    </div>

    <!-- SEARCH -->
    <div class="search-panel" id="searchPanel">
      <div class="search-input-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <circle cx="10.8" cy="10.8" r="6.3"
                  stroke="#777" stroke-width="1.7"/>
          <path d="m16 16 4.2 4.2"
                stroke="#777" stroke-width="1.7"
                stroke-linecap="round"/>
        </svg>

        <input
          id="searchInput"
          class="search-input"
          placeholder="Search Google..."
          autocomplete="off"
        >
      </div>

      <div class="search-hint">
        Press Enter to search · Esc to close · Ctrl/Cmd + K
      </div>
    </div>

  </main>

</div>

<!-- ADD APP MODAL -->
<div class="modal-layer" id="addModal">

  <div class="modal">

    <div class="modal-head">
      <div class="modal-title">Add App</div>
      <button class="close-btn" onclick="closeModal('addModal')">×</button>
    </div>

    <input
      id="appSearch"
      class="input app-search"
      placeholder="Search apps..."
      oninput="filterAppChoices()"
    >

    <div class="app-choices" id="appChoices"></div>

    <button class="add-choice" onclick="showCustomForm()">
      + Add Custom App
    </button>

    <div class="custom-form" id="customForm">

      <label class="modal-label">App name</label>
      <input id="customName" class="input" placeholder="Example: Notion">

      <label class="modal-label">App URL</label>
      <input id="customUrl" class="input" placeholder="https://example.com">

      <label class="modal-label">Icon letter</label>
      <input id="customLetter" class="input" maxlength="2" placeholder="N">

      <div class="modal-actions">
        <button class="secondary-btn" onclick="hideCustomForm()">
          Back
        </button>

        <button class="primary-btn" onclick="addCustomApp()">
          Add App
        </button>
      </div>

    </div>

  </div>
</div>

<!-- CONTEXT MENU -->
<div class="context-menu" id="contextMenu">
  <button class="context-item" onclick="contextOpen()">
    Open App
  </button>

  <button class="context-item remove" onclick="contextRemove()">
    Remove App
  </button>
</div>

<script>

/* =========================================================
   APP DATABASE
========================================================= */

const APP_LIBRARY = [

  {
    id:"whatsapp",
    name:"WhatsApp",
    url:"https://web.whatsapp.com/",
    color:"#25D366",
    icon:`
      <svg viewBox="0 0 40 40">

/* =========================================================
   DEFAULT APPS
========================================================= */

const DEFAULT_IDS = [
  "whatsapp",
  "instagram",
  "gmail",
  "outlook",
  "linkedin",
  "copilot",
  "chatgpt"
];


/* =========================================================
   STORAGE
========================================================= */

let apps = loadApps();

function loadApps(){

  try{

    const saved = JSON.parse(
      localStorage.getItem("loopin_apps")
    );

    if(Array.isArray(saved) && saved.length){
      return saved;
    }

  }catch(e){}

  return DEFAULT_IDS
    .map(id => APP_LIBRARY.find(a => a.id === id))
    .filter(Boolean);
}


function saveApps(){
  localStorage.setItem(
    "loopin_apps",
    JSON.stringify(apps)
  );
}


/* =========================================================
   RENDER SIDEBAR
========================================================= */

function renderApps(){

  const list = document.getElementById("appsList");

  list.innerHTML = "";

  apps.forEach((app,index)=>{

    const item = document.createElement("div");

    item.className = "app-item";
    item.draggable = true;
    item.dataset.index = index;
    item.dataset.name = app.name;

    item.innerHTML = renderAppIcon(app);

    item.onclick = () => openApp(app);

    /* right click remove */
    item.addEventListener("contextmenu",e=>{
      e.preventDefault();

      showContextMenu(
        e.clientX,
        e.clientY,
        index
      );
    });

    /* drag */

    item.addEventListener("dragstart",()=>{
      draggedIndex=index;
      item.classList.add("dragging");
    });

    item.addEventListener("dragend",()=>{
      draggedIndex=null;
      item.classList.remove("dragging");

      document.querySelectorAll(".app-item")
        .forEach(x=>x.classList.remove("drag-over"));
    });

    item.addEventListener("dragover",e=>{
      e.preventDefault();

      if(draggedIndex===null || draggedIndex===index){
        return;
      }

      item.classList.add("drag-over");
    });

    item.addEventListener("dragleave",()=>{
      item.classList.remove("drag-over");
    });

    item.addEventListener("drop",e=>{
      e.preventDefault();

      item.classList.remove("drag-over");

      if(draggedIndex===null || draggedIndex===index){
        return;
      }

      const moved = apps.splice(
        draggedIndex,
        1
      )[0];

      apps.splice(
        index,
        0,
        moved
      );

      saveApps();
      renderApps();
    });

    /* mobile long press */

    let pressTimer;

    item.addEventListener("touchstart",e=>{

      pressTimer=setTimeout(()=>{

        const touch=e.touches[0];

        showContextMenu(
          touch.clientX,
          touch.clientY,
          index
        );

      },650);

    },{passive:true});

    item.addEventListener("touchend",()=>{
      clearTimeout(pressTimer);
    });

    item.addEventListener("touchmove",()=>{
      clearTimeout(pressTimer);
    });

    list.appendChild(item);

  });

}


/* =========================================================
   ICON
========================================================= */

function renderAppIcon(app){

  if(app.icon){

    return `
      <div class="app-icon">
        ${app.icon}
      </div>
    `;

  }

  return `
    <div
      class="app-letter"
      style="background:${app.color || "#111"}"
    >
      ${escapeHtml(app.letter || app.name.charAt(0))}
    </div>
  `;
}


/* =========================================================
   OPEN APP
========================================================= */

function openApp(app){

  /*
    Important:
    External services such as WhatsApp, Instagram,
    Gmail etc. can block iframe embedding.

    We therefore use the user's normal browser session
    and navigate to the official app URL.
  */

  window.location.assign(app.url);
}

/* =========================================================
   SAVED URLS
========================================================= */

function getSavedUrls(){

  try{

    return JSON.parse(
      localStorage.getItem("loopin_urls")
    ) || [];

  }catch(e){

    return [];

  }

}

function saveUrls(data){

  localStorage.setItem(
    "loopin_urls",
    JSON.stringify(data)
  );

}


function renderSaved(workspace){

  const urls=getSavedUrls();

  workspace.innerHTML=`

    <section class="page">

      <div class="page-header">

        <div class="page-title">
          Saved URLs
        </div>

        <div class="page-subtitle">
          Keep useful links available inside LOOPIN.
        </div>

      </div>

      <div class="url-add">

        <input
          id="urlInput"
          placeholder="https://example.com"
        >

        <button
          class="primary-btn"
          onclick="addSavedUrl()"
        >
          Save URL
        </button>

      </div>

      <div
        class="saved-list"
        id="savedList"
      ></div>

    </section>
  `;

  drawSavedUrls();

}


function addSavedUrl(){

  const input =
    document.getElementById("urlInput");

  let url=input.value.trim();

  if(!url){
    return;
  }

  if(!/^https?:\/\//i.test(url)){
    url="https://"+url;
  }

  const data=getSavedUrls();

  data.unshift({
    url:url,
    title:getDomain(url)
  });

  saveUrls(data);

  input.value="";

  drawSavedUrls();

}


function drawSavedUrls(){

  const list=
    document.getElementById("savedList");

  if(!list){
    return;
  }

  const urls=getSavedUrls();

  if(!urls.length){

    list.innerHTML=`
      <div class="empty">
        No saved URLs yet.
      </div>
    `;

    return;
  }

  list.innerHTML="";

  urls.forEach((item,index)=>{

    const card=document.createElement("div");

    card.className="saved-card";

    card.innerHTML=`

      <div class="saved-info">

        <div class="saved-title">
          ${escapeHtml(item.title)}
        </div>

        <div class="saved-url">
          ${escapeHtml(item.url)}
        </div>

      </div>

      <button
        class="small-btn"
        onclick="window.open('${safeJs(item.url)}','_blank')"
      >
        Open
      </button>

      <button
        class="small-btn danger"
        onclick="deleteSavedUrl(${index})"
      >
        Delete
      </button>

    `;

    list.appendChild(card);

  });

}


function deleteSavedUrl(index){

  const urls=getSavedUrls();

  urls.splice(index,1);

  saveUrls(urls);

  drawSavedUrls();

}

/* =========================================================
   REMOVE APP
========================================================= */

function removeApp(index){

  if(index<0 || index>=apps.length){
    return;
  }

  const app=apps[index];

  const yes=confirm(
    `Remove ${app.name} from LOOPIN?`
  );

  if(!yes){
    return;
  }

  apps.splice(index,1);

  saveApps();

  renderApps();

  const settings=
    document.getElementById("manageAppList");

  if(settings){
    drawManageApps();
  }

}


/* =========================================================
   RESET
========================================================= */

function resetApps(){

  const yes=confirm(
    "Restore the default LOOPIN apps?"
  );

  if(!yes){
    return;
  }

  apps=DEFAULT_IDS
    .map(id=>APP_LIBRARY.find(a=>a.id===id))
    .filter(Boolean);

  saveApps();

  renderApps();

  drawManageApps();

}

  localStorage.removeItem("loopin_notes");

function clearUrls(){

  if(!confirm("Delete all saved URLs?")){
    return;

}

========================================================= */

function openAddApp(){

  document
    .getElementById("addModal")
    .classList.add("show");

  document
    .getElementById("appSearch")
    .value="";

  hideCustomForm();

  renderAppChoices();

}


function renderAppChoices(){

  const box=
    document.getElementById("appChoices");

  const query=
    document
      .getElementById("appSearch")
      .value
      .toLowerCase()
      .trim();

  box.innerHTML="";

  const available=
    APP_LIBRARY.filter(app=>{

      const matches=
        app.name
          .toLowerCase()
          .includes(query);

      return matches;

    });

  available.forEach(app=>{

    const choice=
      document.createElement("button");

    choice.className="app-choice";

    choice.type="button";

    choice.innerHTML=`

      <div class="choice-icon">
        ${renderAppIcon(app)}
      </div>

      <div class="choice-info">

        <div class="choice-name">
          ${escapeHtml(app.name)}
        </div>

        <div class="choice-desc">
          ${isInstalled(app)
            ? "Already added"
            : "Add to sidebar"}
        </div>

      </div>

      <div style="
        font-size:15px;
        color:${isInstalled(app) ? "#aaa" : "#111"}
      ">
        ${isInstalled(app) ? "✓" : "+"}
      </div>

    `;

    choice.onclick=()=>{

      if(isInstalled(app)){

        alert(`${app.name} is already in your sidebar.`);

        return;

      }

      apps.push({...app});

      saveApps();

      renderApps();

      closeModal("addModal");

    };

    box.appendChild(choice);

  });

}


function filterAppChoices(){
  renderAppChoices();
}


function isInstalled(app){

  return apps.some(
    a=>a.id===app.id
  );

}

function addCustomApp(){

  const name=
    document
      .getElementById("customName")
      .value
      .trim();

  let url=
    document
      .getElementById("customUrl")
      .value
      .trim();

  const letter=
    document
      .getElementById("customLetter")
      .value
      .trim()
      .toUpperCase();

  if(!name){

    alert("Enter app name.");

    return;
  }

  if(!url){

    alert("Enter app URL.");

    return;
  }

  if(!/^https?:\/\//i.test(url)){
    url="https://"+url;
  }

  const newApp={
    id:"custom_"+Date.now(),
    name:name,
    url:url,
    color:"#111",
    letter:letter || name.charAt(0).toUpperCase()
  };

  apps.push(newApp);

  saveApps();

  renderApps();

  closeModal("addModal");

  document.getElementById("customName").value="";
  document.getElementById("customUrl").value="";
  document.getElementById("customLetter").value="";

}

========================================================= */

    .getElementById(id)
    .classList.remove("show");

}


/* =========================================================
   CONTEXT MENU
========================================================= */

let contextIndex=null;

function showContextMenu(x,y,index){

  contextIndex=index;

  const menu=
    document.getElementById("contextMenu");

  menu.style.left=
    Math.min(
      x,
      window.innerWidth-175
    )+"px";

  menu.style.top=
    Math.min(
      y,
      window.innerHeight-90
    )+"px";

  menu.classList.add("show");

}


function hideContextMenu(){

  document
    .getElementById("contextMenu")
    .classList.remove("show");

  contextIndex=null;

}


function contextOpen(){

  if(contextIndex===null){
    return;
  }

  const app=apps[contextIndex];

  hideContextMenu();

  if(app){
    openApp(app);
  }

}


function contextRemove(){

  if(contextIndex===null){
    return;
  }

  const index=contextIndex;

  hideContextMenu();

  removeApp(index);

}


document.addEventListener("click",e=>{

  const menu=
    document.getElementById("contextMenu");

  if(
    menu.classList.contains("show") &&
    !menu.contains(e.target)
  ){

    hideContextMenu();

  }

});

  panel.classList.toggle("show");

  if(panel.classList.contains("show")){

    setTimeout(()=>{
      document
        .getElementById("searchInput")
        .focus();
    },30);

  }

}


function closeSearch(){

  document
    .getElementById("searchPanel")
    .classList.remove("show");

}


document
  .getElementById("searchInput")
  .addEventListener("keydown",e=>{

    if(e.key==="Enter"){

      const q=e.target.value.trim();

      if(q){

        window.location.href=
          "https://www.google.com/search?q="+
          encodeURIComponent(q);

      }

    }

    if(e.key==="Escape"){
      closeSearch();
    }

  });


document.addEventListener("keydown",e=>{

  if(
    (e.ctrlKey || e.metaKey) &&
    e.key.toLowerCase()==="k"
  ){

    e.preventDefault();

    const panel=
      document.getElementById("searchPanel");

    if(!panel.classList.contains("show")){
      toggleSearch();
    }

  }

});


/* =========================================================
   HELPERS
========================================================= */

function getDomain(url){

  try{

    return new URL(url).hostname;

  }catch(e){

    return url;

  }

}


function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function safeJs(value){

  return String(value)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/\n/g,"\\n")
    .replace(/\r/g,"\\r");

}

   INITIALIZE
========================================================= */

let draggedIndex=null;

renderApps();
